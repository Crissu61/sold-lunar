<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Buget personal: venituri, cheltuieli pe categorii, provizioane si bugete lunare.">
<meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sold Lunar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sold Lunar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#EDF0F5; --line:#E0E4EC;
  --text:#11151C; --muted:#5F6879; --faint:#949CAC;
  --accent:#0E8C82; --accent-ink:#0A6B63; --accent-soft:#DCEFEC; --on-accent:#FFFFFF;
  --ok:#2E8B51; --ok-soft:#DFF0E4;
  --warn:#B5721A; --warn-soft:#F7EBD8;
  --danger:#C2413A; --danger-soft:#F8E3E1;
  --shadow:0 1px 2px rgba(16,20,30,.05), 0 10px 28px -16px rgba(16,20,30,.28);
  --radius:16px;
  --ff:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fm:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F13; --surface:#151A20; --surface2:#1D242C; --line:#2A333E;
    --text:#E8EDF3; --muted:#95A0B0; --faint:#68727F;
    --accent:#2FB6A5; --accent-ink:#8FE0D5; --accent-soft:#10312E; --on-accent:#04110F;
    --ok:#57BC7F; --ok-soft:#132B1D;
    --warn:#DDA455; --warn-soft:#2E2415;
    --danger:#E97B72; --danger-soft:#331A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F13; --surface:#151A20; --surface2:#1D242C; --line:#2A333E;
  --text:#E8EDF3; --muted:#95A0B0; --faint:#68727F;
  --accent:#2FB6A5; --accent-ink:#8FE0D5; --accent-soft:#10312E; --on-accent:#04110F;
  --ok:#57BC7F; --ok-soft:#132B1D;
  --warn:#DDA455; --warn-soft:#2E2415;
  --danger:#E97B72; --danger-soft:#331A18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--ff); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- shell ---------- */
.app{max-width:540px;margin:0 auto;padding:0 14px 108px}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding:10px 0 8px;
}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em}
.backbtn{display:flex;align-items:center;gap:5px;width:100%;margin-top:8px;padding:10px 14px 10px 10px;border-radius:12px;
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:var(--accent-ink);background:var(--accent-soft);text-align:left}
.backbtn svg{width:20px;height:20px;flex:0 0 auto}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.iconbtn:hover{color:var(--text)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 6px}
.monthnav button{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.monthnav button:hover{background:var(--surface2);color:var(--text)}
.monthnav button svg{width:26px;height:26px}
.monthnav .label{font-size:19px;font-weight:700;letter-spacing:-.02em;flex:1;text-align:center}
.monthnav .label span{display:block;font-size:11.5px;font-weight:500;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-top:-1px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 2px}
.mvpick{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.mvpick button{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:18px 44px 18px 18px;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow)}
.mvpick .lb{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.mvpick .lb i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.mvpick .vl{display:block;font-family:var(--fm);font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:7px}
.mvpick .cn{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.mvpick .go{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:26px;line-height:1;color:var(--faint)}
.sect .addbig{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:0 0 auto;align-self:center;box-shadow:0 4px 12px -5px rgba(14,140,130,.6)}
.sect .addbig svg{width:21px;height:21px}
.sect:has(.addbig){align-items:center}
.sect h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0}
.sect button{font-size:13px;font-weight:600;color:var(--accent-ink)}

.balance{padding:20px 18px 16px;position:relative;overflow:hidden}
.balance .lbl{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.balance .big{font-size:40px;font-weight:600;line-height:1.05;margin:6px 0 2px;letter-spacing:-.035em}
.balance .big.neg{color:var(--danger)}
.balance .sub{font-size:13px;color:var(--muted)}
.realrow{display:flex;flex-direction:column;gap:0;margin-top:14px;padding:6px 12px;border-radius:11px;background:var(--surface2)}
.realrow .rline{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:6px 0;background:none;border:0;text-align:left;font:inherit;color:inherit}
.realrow .rline + .rline{border-top:1px solid var(--line)}
.realrow .rline.tap{cursor:pointer}
.realrow .rline.tap .k::after{content:" ›";color:var(--faint)}
.realrow .k{font-size:13px;font-weight:600;color:var(--muted)}
.realrow .v{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.breakdown{display:flex;flex-direction:column;gap:1px;margin-top:12px;padding-top:2px}
.brow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.brow .k{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted)}
.brow .k i{width:8px;height:8px;border-radius:3px;display:block;font-style:normal}
.brow .v{font-size:14px;font-weight:600}
.brow.tap{cursor:pointer;border-radius:8px;margin:0 -6px;padding:6px}
.brow.tap:hover{background:var(--surface2)}

.nextpay{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.np-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);line-height:1.35}
.np-row i{width:6px;height:6px;border-radius:50%;flex:none;margin-top:5px}
.np-row > span{flex:1;min-width:0}
.np-row b{color:var(--text);font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex;margin-top:12px}
.meter i{display:block;height:100%}

/* ---------- lists ---------- */
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;width:100%;text-align:left}
.row + .row{margin-top:8px}
.stack > .row + .row{margin-top:0}
.stack > .bud + .bud{margin-top:0}
.row:hover{border-color:var(--accent)}
.chip{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;letter-spacing:-.02em}
.row .main{flex:1;min-width:0;display:block}
.row .t{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt,.row .pill{white-space:nowrap}
.row .s.s2{white-space:normal;line-height:1.35}
.row .amt{font-weight:600;font-size:15px;flex:none}
.row .amt.in{color:var(--ok)}
.row .mini{display:block;height:3px;border-radius:99px;background:var(--surface2);margin-top:7px;overflow:hidden}
.row .mini i{display:block;height:100%;border-radius:99px}
.row .cnt{font-family:var(--fm);font-size:11px;font-weight:600;padding:2px 7px;border-radius:7px;background:var(--surface2);color:var(--muted);letter-spacing:-.02em;flex:none}
.daysep{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:18px 4px 8px}
.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:26px 16px;border:1px dashed var(--line);border-radius:var(--radius)}

.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.mut{background:var(--surface2);color:var(--muted)}

/* ---------- budget block ---------- */
.bud{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.bud + .bud{margin-top:8px}
.bud .top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bud .nm{font-weight:600;flex:1}
.bud .pct{font-family:var(--fm);font-weight:600;font-size:15px}
.bud .legend{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.inp{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:11px;padding:12px 13px;font-size:15.5px}
.inp:focus{background:var(--surface);border-color:var(--accent);outline:none}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.inp.money{font-family:var(--fm);font-size:26px;font-weight:600;text-align:right;padding:14px 15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 > .btn{font-size:13.5px;padding:12px 8px}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:14px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{width:100%;padding:14px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;letter-spacing:-.01em}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.dang{background:var(--danger-soft);color:var(--danger)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.switch small{display:block;color:var(--faint);font-size:12.5px;font-weight:500}
.tog{width:46px;height:27px;border-radius:99px;background:var(--surface2);position:relative;flex:none;transition:background .16s}
.tog i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .16s}
.tog[aria-pressed="true"]{background:var(--accent)}
.tog[aria-pressed="true"] i{transform:translateX(19px)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,11,16,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:540px;margin:0 auto;
  background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;transform:translateY(102%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -12px 40px -12px rgba(0,0,0,.35);
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:800;letter-spacing:-.02em}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.tog,.tog i{transition:none}}

/* ---------- nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:540px;margin:0 auto;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px;border-radius:12px;color:var(--faint);font-size:9.5px;font-weight:600;letter-spacing:0}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button[aria-current="true"]{color:var(--accent-ink)}
.nav svg{width:20px;height:20px}
/* ---------- report ---------- */
.bars{display:flex;align-items:flex-end;gap:7px;height:104px;margin:6px 0 10px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b i{width:100%;background:var(--surface2);border-radius:6px 6px 3px 3px;min-height:3px;display:block}
.bars .b.cur i{background:var(--accent)}
.bars .b em{font-style:normal;font-size:10px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .k{background:var(--surface2);border-radius:12px;padding:11px 12px}
.kpi .k b{display:block;font-family:var(--fm);font-size:17px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.kpi .k span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tot{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 2px;border-top:1px solid var(--line);margin-top:10px;font-weight:700}
.hint{font-size:12.5px;color:var(--faint);line-height:1.5;margin:10px 2px 0}
.toast{position:fixed;left:50%;bottom:96px;white-space:nowrap;transform:translate(-50%,14px);z-index:90;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet-open .toast{bottom:auto;top:74px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandrow">
      <div class="brand" id="brandBox"><span class="dot"></span><span>Sold Lunar<small id="brandSub">buget personal</small></span></div>
      <div style="display:flex;gap:8px;flex:none">
        <button class="iconbtn" id="langBtn" style="font-size:12px;font-weight:800;letter-spacing:.04em">RO</button>
        <button class="iconbtn" id="themeBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </div>
    <div class="monthnav">
      <button id="prevM" aria-label="Luna anterioară"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="label" id="mLabel"></div>
      <button id="nextM" aria-label="Luna următoare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <button class="backbtn" id="backBtn" hidden aria-label="Înapoi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span id="backTxt"></span>
    </button>
  </div>
  <main id="view"></main>
</div>

<nav class="nav" id="nav"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============ state ============ */
var KEY = "sold-lunar-v1";
var PALETTE = ["#0E8C82","#C2413A","#7B5BD6","#B5721A","#2E8B51","#C4477F","#3B72D6","#8A7A2E","#D06A2B","#5A6B7B"];
var CAT_KEYS = ["food","utils","transport","loans","subs","beauty","vices","health","fun","other"];
var CAT_NAMES = {
  food:{ro:"Mâncare",en:"Food"}, utils:{ro:"Utilități",en:"Utilities"}, transport:{ro:"Transport",en:"Transport"},
  loans:{ro:"Rate bancare",en:"Loan payments"}, subs:{ro:"Abonamente",en:"Subscriptions"}, beauty:{ro:"Beauty",en:"Beauty"},
  vices:{ro:"Vicii",en:"Vices"}, health:{ro:"Sănătate",en:"Health"}, fun:{ro:"Divertisment",en:"Entertainment"},
  other:{ro:"Altele",en:"Other"}
};
function catName(key){ var c = CAT_NAMES[key]; return c ? (c[LG] || c.ro) : key; }

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function seed(){
  var cats = CAT_KEYS.map(function(k,i){ return {id:uid(), key:k, name:CAT_NAMES[k].ro, color:PALETTE[i % PALETTE.length]}; });
  return { cats:cats, fixed:[], incomes:[], expenses:[], provisions:[], budgets:{}, stdBudgets:{}, learn:{}, savings:{moves:[],plans:[]}, lang:"ro", carry:true, carrySet:true, theme:"auto" };
}
var storageOK = (function(){
  try{ var k="__t"+Date.now(); localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
var memStore = null;
function load(){
  try{
    if(!storageOK) return memStore || seed();
    var raw = localStorage.getItem(KEY);
    if(!raw){
      var fresh = seed();
      /* la prima pornire iau limba din browser */
      var nav = (navigator.language || navigator.userLanguage || "ro").toLowerCase();
      fresh.lang = nav.indexOf("ro") === 0 ? "ro" : "en";
      if(fresh.lang === "en") fresh.cats.forEach(function(c){ if(CAT_NAMES[c.key]) c.name = CAT_NAMES[c.key].en; });
      return fresh;
    }
    var s = JSON.parse(raw);
    if(!s || !s.cats || !s.cats.length) return seed();
    ["fixed","incomes","expenses","provisions"].forEach(function(k){ if(!Array.isArray(s[k])) s[k]=[]; });
    if(!s.budgets) s.budgets={}; if(!s.stdBudgets) s.stdBudgets={}; if(!s.learn) s.learn={};
    if(!s.savings || typeof s.savings !== "object") s.savings = {moves:[], plans:[]};
    if(!Array.isArray(s.savings.moves)) s.savings.moves = [];
    if(!Array.isArray(s.savings.plans)) s.savings.plans = [];
    migrate(s);
    return s;
  }catch(e){ return seed(); }
}
/* transforma vechile campuri skip/until in perioade de pauza */
function migrateOff(o){
  if(!Array.isArray(o.off)) o.off = [];
  if(o.skip){
    for(var k in o.skip){ if(o.skip[k]) o.off.push({ from:k, until:k }); }
    delete o.skip;
  }
  if(o.until){ o.off.push({ from: shiftM(o.until, 1), until: null }); delete o.until; }
}
function migrate(s){
  if(s.lang !== "en") s.lang = "ro";
  (s.cats||[]).forEach(function(c){
    if(c.key) return;
    for(var k in CAT_NAMES){
      if(normTxt(c.name) === normTxt(CAT_NAMES[k].ro) || normTxt(c.name) === normTxt(CAT_NAMES[k].en)){ c.key = k; break; }
    }
  });
  if(!s.savings) s.savings = {moves:[], plans:[]};
  (s.savings.plans||[]).forEach(migrateOff);
  if(s.carrySet !== true){ s.carry = true; s.carrySet = true; }   /* pornit implicit, o singura data */
  (s.fixed||[]).concat(s.provisions||[]).forEach(migrateOff);
  (s.fixed||[]).forEach(function(f){
    if(!f.hist || typeof f.hist !== "object"){
      f.hist = {};
      f.hist[f.from || "2000-01"] = f.amount || 0;
    }
  });
  (s.provisions||[]).forEach(function(p){
    if(!p.pay) p.pay = {};
    if(p.settled){
      for(var m in p.settled){
        if(!p.pay[m]) p.pay[m] = { ids:[p.settled[m]], closed:true };
      }
      delete p.settled;
    }
  });
}
function save(){
  memStore = S;
  if(!storageOK) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; }
}

  bump("=" + t);
  t.split(" ").forEach(function(w){ if(w.length >= 3) bump(w); });
  /* curatenie: daca s-au adunat prea multe chei, le scot pe cele folosite o singura data */
  var keys = Object.keys(S.learn);
  if(keys.length > 600){
    keys.forEach(function(k){
      var tot = 0, m = S.learn[k];
      for(var c in m) tot += m[c];
      if(tot <= 1) delete S.learn[k];
    });
  }
}
function unlearnCategory(catId){
  if(!S.learn) return;
  Object.keys(S.learn).forEach(function(k){
    delete S.learn[k][catId];
    if(!Object.keys(S.learn[k]).length) delete S.learn[k];
  });
}
function guessCategory(note){
  var t = normTxt(note);
  if(!t) return null;
  var words = t.split(" ").filter(function(w){ return w.length >= 3; });
  var scores = {}, c;

  function add(key, weight){
    var m = S.learn && S.learn[key];
    if(!m) return;
    for(var k in m){ if(catExists(k)) scores[k] = (scores[k] || 0) + m[k] * weight; }
  }
  add("=" + t, 100);
  words.forEach(function(w){ add(w, 3); });

  var best = null, bs = 0;
  for(c in scores){ if(scores[c] > bs){ bs = scores[c]; best = c; } }
  if(best) return best;

  /* fara istoric: dictionarul de pornire */
  var seedScore = {};
  for(var key in SEED){
    var id = catIdByKey(key);
    if(!id) continue;
    SEED[key].forEach(function(kw){
      if(t.indexOf(kw) !== -1) seedScore[id] = (seedScore[id] || 0) + kw.length;
    });
  }
  best = null; bs = 0;
  for(c in seedScore){ if(seedScore[c] > bs){ bs = seedScore[c]; best = c; } }
  return best;
}

/* ---- REPORT ---- */
function viewReport(){
  var m = ui.month, h = "";
  var rows = byCategory(m);
  var totS = 0; rows.forEach(function(r){ totS += r.spent; });
  var inc = totalIncome(m), prov = totalOpenProv(m);

  var months = [], cur = shiftM(m,-5);
  for(var i=0;i<6;i++){ months.push(cur); cur = shiftM(cur,1); }
  var vals = months.map(function(x){ return totalExpense(x); });
  var mx = Math.max.apply(null, vals.concat([1]));

  h += '<div class="card stack" style="margin-top:12px">'+
    '<div class="kpi">'+
      '<div class="k"><span>'+tr("Venituri")+'</span><b style="color:var(--ok)">'+esc(lei(inc))+'</b></div>'+
      '<div class="k"><span>'+tr("Cheltuieli")+'</span><b>'+esc(lei(totS))+'</b></div>'+
      '<div class="k"><span>'+tr("Provizionat")+'</span><b style="color:var(--warn)">'+esc(lei(prov))+'</b></div>'+
      '<div class="k"><span>'+(carryPending(m)?tr("Rămas (fără report)"):tr("Rămas"))+'</span><b style="color:'+(balance(m)<0?"var(--danger)":"var(--accent-ink)")+'">'+esc(lei(balance(m)))+'</b></div>'+
    '</div>'+
    '<div><div class="lbl" style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-top:6px">'+tr("Cheltuieli, ultimele 6 luni")+'</div>'+
    '<div class="bars">'+ months.map(function(x,i){
      var hgt = Math.max(3, vals[i]/mx*100);
      return '<div class="b'+(x===m?" cur":"")+'"><i style="height:'+hgt+'%" title="'+esc(leiShort(vals[i]))+'"></i><em>'+esc(mShort(x))+'</em></div>';
    }).join("") +'</div>'+
    '<div class="hint" style="margin-top:0">'+tr("Maxim:")+' '+esc(leiShort(mx))+'</div></div>'+
    '</div>';

  h += '<div class="sect"><h2>'+tr("Rezumat pe categorii ·")+' '+esc(mLabel(m))+'</h2></div><div class="stack" style="margin-top:8px">';
  if(!rows.length){ h += '<div class="empty">'+tr("Nimic de raportat pentru luna asta.")+'</div>'; return h; }
  h += '<div class="card" style="padding:6px 14px 14px">';
  rows.forEach(function(r){
    var c = cat(r.catId);
    var share = totS>0 ? r.spent/totS*100 : 0;
    var b = budgetOf(m,c.id);
    h += '<div style="padding:12px 0;border-bottom:1px solid var(--line)">'+
      '<div style="display:flex;align-items:center;gap:10px">'+
      '<span class="chip" style="width:28px;height:28px;border-radius:9px;font-size:12px;background:'+tint(c.color,.14)+';color:'+c.color+'">'+esc(initials(c.name))+'</span>'+
      '<span style="flex:1;min-width:0"><span style="display:block;font-weight:600">'+esc(c.name)+'</span>'+
      '<span style="display:block;font-size:12.5px;color:var(--faint)">'+r.n+' '+(r.n===1?tr("cheltuială"):tr("cheltuieli"))+' · '+Math.round(share)+tr("% din total")+(b?" "+tr("· buget")+" "+leiShort(b):"")+'</span></span>'+
      '<span class="num" style="font-weight:600">'+esc(lei(r.spent))+'</span></div>'+
      '<div class="meter" style="margin-top:9px;height:6px"><i style="width:'+share+'%;background:'+c.color+'"></i></div>'+
      (r.prov>0 ? '<div class="hint" style="margin:6px 0 0">+ '+esc(lei(r.prov))+' '+tr("provizionat, încă neplătit")+'</div>' : '')+
      '</div>';
  });
  h += '<div class="tot"><span>'+tr("Total cheltuit")+'</span><span class="num">'+esc(lei(totS))+'</span></div>';
  h += '</div></div>';
  return h;
}

/* ============ sheet ============ */
var sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
function openSheet(html){
  sheet.innerHTML = '<div class="grab"></div>' + html;
  scrim.classList.add("on"); sheet.classList.add("on"); document.body.classList.add("sheet-open");
  var f = sheet.querySelector("[data-focus]"); if(f) setTimeout(function(){ f.focus(); }, 240);
}
function closeSheet(){ scrim.classList.remove("on"); sheet.classList.remove("on"); document.body.classList.remove("sheet-open"); }
scrim.addEventListener("click", closeSheet);

function catOptions(sel){
  return S.cats.map(function(c){ return '<option value="'+c.id+'"'+(c.id===sel?" selected":"")+'>'+esc(c.name)+'</option>'; }).join("");
}
function moneyField(label, id, val){
  return '<label class="f"><span>'+label+'</span><input class="inp money" id="'+id+'" inputmode="decimal" value="'+(val!=null?Number(val).toFixed(2).replace(".", DEC):"")+'" placeholder="'+(DEC === "," ? "0,00" : "0.00")+'"></label>';
}

/* --- expense sheet --- */
function sheetExpense(id, presetProvId){
  var e = id ? S.expenses.filter(function(x){ return x.id===id; })[0] : null;
  var open = openProvisions(ui.month);
  var h = '<h3>'+(e?tr("Editează cheltuiala"):tr("Cheltuială nouă"))+'</h3>';
  if(!e && open.length){
    h += '<label class="f"><span>'+tr("Din provizion (opțional)")+'</span><select class="inp" id="fProv"><option value="">'+tr("— cheltuială nouă —")+'</option>'+
      open.map(function(x){ return '<option value="'+x.p.id+'"'+(x.p.id===presetProvId?" selected":"")+'>'+esc(x.p.name)+' '+tr("· rest")+' '+esc(leiShort(x.remaining))+'</option>'; }).join("")+
      '</select></label>';
  }
  h += '<label class="f"><span>'+tr("Descriere")+'</span><input class="inp" id="fNote" data-focus placeholder="'+tr("ex. parfum, benzină, țigări")+'" value="'+esc(e?e.note:"")+'"></label>';
  h += '<label class="f" style="margin-bottom:6px"><span>'+tr("Categorie")+'</span><select class="inp" id="fCat">'+catOptions(e?e.catId:null)+'</select></label>'+
       '<p class="hint" id="catHint" hidden style="margin:0 2px 14px"></p>';
  h += moneyField(tr("Sumă"), "fAmt", e?e.amount:null);
  h += '<label class="f"><span>'+tr("Data")+'</span><input class="inp" type="date" id="fDate" value="'+(e?e.date:dateInMonth(ui.month))+'"></label>';
  if(!e && open.length){
    h += '<div id="fCloseBox" hidden><span style="display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:6px">'+tr("După această plată")+'</span>'+
      '<div class="seg"><button type="button" data-cls="1" aria-pressed="true">'+tr("Închide provizionul")+'</button>'+
      '<button type="button" data-cls="0" aria-pressed="false">'+tr("Îl las deschis")+'</button></div>'+
      '<p class="hint" id="fCloseHint" style="margin:-6px 2px 14px"></p></div>'+
      '<input type="hidden" id="fCloseVal" value="1">';
  }
  h += '<button class="btn" data-save="exp" data-id="'+(e?e.id:"")+'">'+(e?tr("Salvează"):tr("Adaugă cheltuiala"))+'</button>';
  if(e) h += '<button class="btn dang" style="margin-top:8px" data-del="exp" data-id="'+e.id+'">'+tr("Șterge")+'</button>';
  openSheet(h);

  var noteEl = document.getElementById("fNote"), catEl = document.getElementById("fCat"),
      catHint = document.getElementById("catHint"), catTouched = !!e;
  if(noteEl && catEl){
    catEl.addEventListener("change", function(){ catTouched = true; if(catHint) catHint.hidden = true; });
    var tmr = null;
    noteEl.addEventListener("input", function(){
      if(catTouched) return;
      clearTimeout(tmr);
      tmr = setTimeout(function(){
        var g = guessCategory(noteEl.value);
        if(g && g !== catEl.value){
          catEl.value = g;
          catHint.hidden = false;
          catHint.textContent = tr("Categorie propusă:")+" " + cat(g).name + tr(". Schimb-o dacă nu e bine — rețin alegerea ta.");
        } else if(!g && catHint){ catHint.hidden = true; }
      }, 220);
    });
  }

  var sel = document.getElementById("fProv");
  if(sel){
    var box = document.getElementById("fCloseBox"), val = document.getElementById("fCloseVal");
    var chint = document.getElementById("fCloseHint"), picked = false;
    var amtEl = document.getElementById("fAmt");

    function setChoice(v){
      val.value = v ? "1" : "0";
      Array.prototype.forEach.call(box.querySelectorAll("[data-cls]"), function(b){
        b.setAttribute("aria-pressed", (b.getAttribute("data-cls") === "1") === !!v);
      });
      var pr = S.provisions.filter(function(x){ return x.id === sel.value; })[0];
      if(!pr) return;
      var rest = Math.max(0, provRemaining(pr, ui.month) - parseNum(amtEl.value));
      chint.textContent = v
        ? (rest > 0 ? tr("Provizionul dispare din sold, inclusiv diferența de")+" " + lei(rest) + "."
                    : tr("Provizionul se închide — nu mai rămâne nimic de plătit din el."))
        : (rest > 0 ? tr("Rămân")+" " + lei(rest) + " "+tr("provizionați pentru restul cheltuielilor.")
                    : tr("Provizionul rămâne deschis, dar suma lui e deja acoperită."));
    }
    function refreshBox(){
      var pr = S.provisions.filter(function(x){ return x.id === sel.value; })[0];
      box.hidden = !pr;
      if(!pr) return;
      if(!picked) setChoice(parseNum(amtEl.value) >= provRemaining(pr, ui.month));
      else setChoice(val.value === "1");
    }
    Array.prototype.forEach.call(box.querySelectorAll("[data-cls]"), function(b){
      b.addEventListener("click", function(){ picked = true; setChoice(b.getAttribute("data-cls") === "1"); });
    });
    amtEl.addEventListener("input", refreshBox);

    sel.addEventListener("change", function(){
      picked = false;
      var pr = S.provisions.filter(function(x){ return x.id === sel.value; })[0];
      if(pr){
        amtEl.value = String(provRemaining(pr, ui.month)).replace(".", DEC);
        if(pr.catId) document.getElementById("fCat").value = pr.catId;
        document.getElementById("fNote").value = pr.name;
      }
      refreshBox();
    });
    if(presetProvId){ sel.dispatchEvent(new Event("change")); } else refreshBox();
  }
}

  var v = (kind==="var" && id) ? S.incomes.filter(function(x){ return x.id===id; })[0] : null;

    if(ch.length > 1){
      h += '<div style="background:var(--surface2);border-radius:13px;padding:12px 14px;margin-bottom:14px">'+
        '<div style="font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:4px">'+tr("Istoricul sumei")+'</div>'+
        ch.map(function(c, i){
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px">'+
            '<span>din '+esc(mLabel(c.month))+'</span>'+
            '<span style="display:flex;align-items:center;gap:10px">'+
            '<span class="num" style="font-weight:600">'+esc(lei(c.amount))+'</span>'+
            (i === 0 ? '' : '<button type="button" class="hint" data-delhist="'+f.id+'|'+c.month+'" style="text-decoration:underline;padding:0">'+tr("șterge")+'</button>')+
            '</span></div>';
        }).join("")+'</div>';
    }
  }
  h += '<div id="iDayBox"'+(k==="fix"?"":" hidden")+'><label class="f"><span>'+tr("Zi de încasare")+'</span>'+
       '<input class="inp num" id="iDay" type="number" min="1" max="31" inputmode="numeric" placeholder="ex. 25" value="'+((f&&f.day)?f.day:"")+'"></label>'+
       '<p class="hint" id="iDayHint" style="margin:-6px 2px 14px"></p></div>';
  h += '<input type="hidden" id="iKind" value="'+k+'">';
  if(f && isOff(f, ui.month)){
    h += '<p class="hint" style="margin:0 2px 10px;color:var(--warn)">'+esc(offReason(f, ui.month))+'.</p>'+
         '<button class="btn ghost" style="margin-bottom:10px" data-reactivate="fix|'+f.id+'">'+tr("Reactivează…")+'</button>';

      ? '<button class="btn dang" style="margin-top:8px" data-delscopeopen="fix|'+f.id+'">'+tr("Șterge venitul…")+'</button>'
      : '<button class="btn dang" style="margin-top:8px" data-del="inc" data-id="'+cur.id+'" data-kind="var">'+tr("Șterge")+'</button>';

  openSheet(h);
  var dayEl2 = document.getElementById("iDay"), dayHint = document.getElementById("iDayHint");
  if(dayEl2 && dayHint){
    function updDayHint(){
      var d = parseInt(dayEl2.value, 10);
      if(!d || d < 1 || d > 31){
        dayHint.innerHTML = tr("Cu ziua completată, ecranul principal îți arată câte zile mai sunt până la următoarea încasare și ce plăți programate pică până atunci.");
        return;
      }
      var real = dateForDay(ui.month, d), eff = salaryDate(ui.month, d);
      if(eff.getDate() !== real.getDate()){
        dayHint.innerHTML = tr("În {0}, {1} cade {2} — aplicația folosește <b>{3}, {4}</b>, ultima zi lucrătoare dinainte.", esc(mLabel(ui.month).split(" ")[0]), d, DAYS[real.getDay()], DAYS[eff.getDay()], eff.getDate());

  function setHint(kk){ if(hint) hint.textContent = kk==="fix" ? tr("Se adaugă automat în fiecare lună, începând cu")+" "+mLabel(ui.month)+"." : tr("Se adaugă doar în")+" "+mLabel(ui.month)+"."; }
  setHint(k);

    if(b.classList.contains("btn")) return;

      Array.prototype.forEach.call(sheet.querySelectorAll(".seg [data-kind]"), function(x){ x.setAttribute("aria-pressed", x===b); });

      if(box) box.hidden = b.getAttribute("data-kind") !== "fix";
      setHint(b.getAttribute("data-kind"));
    });
  });
}

       '<label class="f"><span>'+tr("Din total rate")+'</span><input class="inp num" id="pTot" type="number" min="1" inputmode="numeric" placeholder="ex. 24" value="'+((p&&p.term)?p.term:"")+'"></label>'+

  if(p && isOff(p, ui.month)){
    h += '<p class="hint" style="margin:0 2px 10px;color:var(--warn)">'+esc(offReason(p, ui.month))+'.</p>'+
         '<button class="btn ghost" style="margin-bottom:14px" data-reactivate="prov|'+p.id+'">'+tr("Reactivează…")+'</button>';
  }
  if(p && (paid > 0 || settled)){
    var pays = provPayments(p, ui.month);
    h += '<div style="background:var(--surface2);border-radius:13px;padding:12px 14px;margin-bottom:14px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)">'+
      '<span>'+tr("Plăți în")+' '+esc(mLabel(ui.month).split(" ")[0])+'</span><span>'+(settled?tr("închis"):"deschis")+'</span></div>';
    h += pays.map(function(x){
      return '<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:13.5px">'+
        '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.note || cat(x.catId).name)+'</span>'+
        '<span class="num" style="font-weight:600;flex:none">'+esc(lei(x.amount))+'</span></div>';
    }).join("") || '<p class="hint" style="margin:6px 0 0">'+tr("Fără plăți înregistrate.")+'</p>';
    var dlt = provDelta(p, ui.month);
    var fLabel, fVal, fCol;
    if(dlt > 0){ fLabel = tr("Depășit cu"); fVal = lei(dlt); fCol = "var(--danger)"; }
    else if(dlt === 0){ fLabel = tr("Acoperit exact"); fVal = ""; fCol = "var(--ok)"; }
    else if(settled){ fLabel = tr("Rămas neutilizat"); fVal = lei(-dlt); fCol = "var(--muted)"; }
    else { fLabel = tr("Rest de acoperit"); fVal = lei(remaining); fCol = "var(--warn)"; }
    h += '<div style="display:flex;justify-content:space-between;gap:10px;padding-top:9px;margin-top:4px;border-top:1px solid var(--line);font-weight:700;font-size:13.5px">'+
      '<span>'+esc(fLabel)+'</span>'+
      '<span class="num" style="color:'+fCol+'">'+esc(fVal)+'</span></div>';
    h += '<div class="hint" style="margin:8px 0 0">'+esc(tr("Provizionat {0} · achitat {1}", lei(p.amount), lei(paid)))+'</div>';
    h += '</div>';
  }
  h += '<button class="btn" data-save="prov" data-id="'+(p?p.id:"")+'">'+(p?tr("Salvează"):tr("Adaugă provizionul"))+'</button>';
  if(p){
    if(!settled){
      h += '<button class="btn ghost" style="margin-top:8px" data-payprov="'+p.id+'">'+tr("Înregistrează o plată")+'</button>';
      if(remaining > 0 && paid > 0) h += '<button class="btn ghost" style="margin-top:8px" data-closeprov="'+p.id+'">'+tr("Închide-l acum (renunț la restul de")+' '+esc(leiShort(remaining))+')</button>';
    } else {
      h += '<button class="btn ghost" style="margin-top:8px" data-reopenprov="'+p.id+'">'+tr("Redeschide provizionul")+'</button>';
    }
    h += p.recurring
      ? '<button class="btn dang" style="margin-top:8px" data-delscopeopen="prov|'+p.id+'">'+tr("Șterge sau oprește provizionul…")+'</button>'
      : '<button class="btn dang" style="margin-top:8px" data-del="prov" data-id="'+p.id+'">'+tr("Șterge provizionul")+'</button>';
  }
  openSheet(h);

  var rec = document.getElementById("pRec"), box = document.getElementById("pTermBox");
  var idxI = document.getElementById("pIdx"), totI = document.getElementById("pTot"), hint = document.getElementById("pTermHint");
  function refreshTerm(){
    box.hidden = rec.value !== "term";
    if(box.hidden) return;
    var i = parseInt(idxI.value,10) || 1, t = parseInt(totI.value,10) || 0;
    var amt = parseNum(document.getElementById("pAmt").value);
    if(t < 1){ hint.textContent = tr("Completează câte rate are în total (ex. 24)."); return; }
    if(i > t){ hint.textContent = tr("Rata curentă (") + i + tr(") depășește totalul de")+" " + t + "."; return; }
    var left = t - i + 1;
    var lastM = shiftM(ui.month, left - 1);
    hint.textContent = tr("Mai ai")+" " + left + (left===1?" "+tr("rată"):(left<20?" rate":" "+tr("de rate"))) +
      tr(", ultima în")+" " + mLabel(lastM) + (amt>0 ? " "+tr("· rest de plată")+" " + lei(left*amt) : "") + ".";
  }
  rec.addEventListener("change", refreshTerm);
  idxI.addEventListener("input", refreshTerm);
  totI.addEventListener("input", refreshTerm);
  document.getElementById("pAmt").addEventListener("input", refreshTerm);
  refreshTerm();
}

function saveBudgetCat(catId){
  var m = ui.month, v = parseNum(document.getElementById("bcAmt").value);
  var std = document.getElementById("bcStd").getAttribute("aria-pressed") === "true";
  if(!S.budgets[m]) S.budgets[m] = {};
  if(!(v > 0)){ delete S.budgets[m][catId]; delete S.stdBudgets[catId]; closeSheet(); commit(tr("Buget șters")); return; }
  S.budgets[m][catId] = v;
  if(std) S.stdBudgets[catId] = v; else delete S.stdBudgets[catId];
  closeSheet(); commit(tr("Buget salvat"));
}
function deleteBudget(scope, catId){
  var m = ui.month;
  if(!S.budgets[m]) S.budgets[m] = {};
  if(scope === "month"){
    S.budgets[m][catId] = 0;                 /* 0 = fara limita luna asta, standardul ramane */
    closeSheet(); commit(tr("Fără buget luna asta"));
  } else {
    delete S.budgets[m][catId];
    delete S.stdBudgets[catId];
    closeSheet(); commit(tr("Buget șters"));
  }
}

function viewSavings(){

  var past = m < curMonth();
  var h = '<div class="card balance stack" style="margin-top:12px">'+
    '<div><div class="lbl">'+tr("Sold economii")+'</div>'+

    '<div class="sub">'+esc(past ? tr("la finalul lunii")+" "+mLabel(m).split(" ")[0] : tr("acum"))+'</div></div>'+
    ((net !== 0 || planNet !== 0)
      ? '<div class="realrow">'+
        (net !== 0
          ? '<span class="rline"><span class="k">'+
            esc(net > 0 ? tr("Depus în")+" "+mLabel(m).split(" ")[0] : tr("Retras în")+" "+mLabel(m).split(" ")[0])+

          : '')+
        '</div>'
      : '')+
    '<div class="grid2" style="margin-top:14px">'+
      '<button class="btn ghost" data-savemove="in">'+tr("Depune")+'</button>'+
      '<button class="btn ghost" data-savemove="out">'+tr("Retrage")+'</button>'+
    '</div></div>';

  var plans = S.savings.plans || [];
  h += '<div class="sect"><h2>'+tr("Transferuri recurente")+'</h2><button data-saveplan="new">'+tr("+ Adaugă")+'</button></div><div class="stack" style="margin-top:8px">';
  if(!plans.length){
    h += '<div class="empty">'+tr("Niciun transfer recurent. Setează o sumă care se mută automat în fiecare lună.")+'</div>';
  } else {
    h += plans.map(function(pl){
      var live = pl.active !== false && !isOff(pl, m) && m >= pl.from;
      var why = live ? (tr("în fiecare lună pe")+" " + (pl.day||1)) : (offReason(pl, m) || (tr("începe din")+" " + mLabel(pl.from)));
      if(live){
        var nxt = plan2.filter(function(x){ return x.plan.id === pl.id; })[0];
        if(nxt) why += " · " + tr("următorul {0}", dayLabel(nxt.date));
      }
      return '<button class="row" data-saveplan="'+pl.id+'"'+(live?"":' style="opacity:.6"')+'>'+
        '<span class="chip" style="background:'+tint(pl.dir==="in"?"#3B72D6":"#B5721A",.14)+';color:'+(pl.dir==="in"?"#3B72D6":"#B5721A")+'">'+esc(pl.dir==="in"?"↑":"↓")+'</span>'+
        '<span class="main"><span class="t">'+esc(pl.name)+'</span><span class="s">'+esc(pl.dir==="in"?tr("spre economii"):tr("din economii"))+' · '+esc(why)+'</span></span>'+
        '<span class="amt num">'+esc(lei(pl.amount))+'</span></button>';
    }).join("");
  }
  h += '</div>';

  var moves = S.savings.moves.slice().sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }).slice(0, 60);
  h += '<div class="sect"><h2>'+tr("Mișcări")+'</h2></div><div class="stack" style="margin-top:8px">';
  if(plan2.length){
    h += plan2.map(function(x){
      return '<button class="row" data-saveplan="'+x.plan.id+'" style="opacity:.6;border-style:dashed">'+
        '<span class="chip" style="background:'+tint(x.dir==="in"?"#3B72D6":"#B5721A",.10)+';color:'+(x.dir==="in"?"#3B72D6":"#B5721A")+'">'+esc(x.dir==="in"?"↑":"↓")+'</span>'+
        '<span class="main"><span class="t">'+esc(x.name)+'</span>'+
        '<span class="s">'+esc(tr("programat")+" · "+dayLabel(x.date))+'</span></span>'+
        '<span class="amt num" style="color:var(--muted)">'+(x.dir==="in"?"+":"−")+esc(lei(x.amount))+'</span></button>';
    }).join("");
  }
  if(!moves.length && !plan2.length){
    h += '<div class="empty">'+tr("Nicio mișcare încă. Depune prima sumă.")+'</div>';
  } else {
    var curM = "";
    moves.forEach(function(x){
      var mm = x.date.slice(0,7);
      if(mm !== curM){ curM = mm; h += '<div class="daysep">'+esc(mLabel(mm))+'</div>'; }
      h += '<button class="row" data-savemoveedit="'+x.id+'">'+
        '<span class="chip" style="background:'+tint(x.dir==="in"?"#3B72D6":"#B5721A",.14)+';color:'+(x.dir==="in"?"#3B72D6":"#B5721A")+'">'+esc(x.dir==="in"?"↑":"↓")+'</span>'+
        '<span class="main"><span class="t">'+esc(x.note || (x.dir==="in"?tr("Depunere"):tr("Retragere")))+'</span>'+
        '<span class="s">'+esc(dayLabel(x.date))+(x.planId?" "+tr("· recurent"):"")+'</span></span>'+
        '<span class="amt num" style="color:'+(x.dir==="in"?"var(--accent-ink)":"var(--warn)")+'">'+(x.dir==="in"?"+":"−")+esc(lei(x.amount))+'</span></button>';
    });
  }
  h += '</div>';
  return h;
}

function saveSavingsMove(id){
  var amt = parseNum(document.getElementById("svAmt").value);
  if(amt <= 0){ toast(tr("Adaugă o sumă mai mare ca zero")); return; }
  var noteEl = document.getElementById("svNote");
  var note = noteEl ? noteEl.value.trim() : "";
  var date = document.getElementById("svDate").value || dateInMonth(ui.month);
  var dir = document.getElementById("svDir").value;
  if(dir === "out"){
    var av = savingsAvailAt(date, id || null);
    if(amt > av){ toast(tr("Nu poți retrage mai mult decât ai — {0} în economii", lei(av))); return; }
  }
  if(id){

/* --- arhiva: ce nu se aplica in luna deschisa --- */
function archivedItems(m){
  var out = [];
  S.fixed.forEach(function(f){
    if(fixedLive(f, m)) return;
    var why = offReason(f, m);
    if(!why){
      if(f.active === false) return;
      why = tr("începe din")+" " + mLabel(fixedStart(f));
    }
    out.push({ kind:"fix", obj:f, why:why, kindLabel:tr("venit fix") });
  });
  (S.savings.plans||[]).forEach(function(pl){
    if(pl.active !== false && !isOff(pl, m) && m >= pl.from) return;
    var why = offReason(pl, m) || (tr("începe din")+" " + mLabel(pl.from));
    out.push({ kind:"splan", obj:pl, why:why, kindLabel: pl.dir === "in" ? tr("transfer spre economii") : tr("transfer din economii") });
  });
  S.provisions.forEach(function(p){
    if(provActive(p, m)) return;
    var why = offReason(p, m);
    if(!why){
      if(!p.recurring) why = tr("o singură dată, în")+" " + mLabel(p.month);
      else if(p.term){
        var lm = provLastMonth(p);
        why = (m > lm) ? (tr("încheiat · ultima rată în")+" " + mLabel(lm)) : (tr("începe din")+" " + mLabel(p.from));
      } else why = tr("începe din")+" " + mLabel(p.from || m);
    }
    out.push({ kind:"prov", obj:p, why:why, kindLabel: p.recurring ? (p.term ? tr("rată") : tr("provizion lunar")) : tr("provizion o singură dată") });
  });
  return out;
}
function monthOptions(sel){

  }

function sheetReactivate(kind, id){

       (restart ? tr("Seria de rate s-a încheiat, deci repornește de la rata 1 din luna aleasă.")
                : tr("Se aplică din luna aleasă înainte. Lunile dinainte rămân neatinse."))+'</p>';

function doReactivate(kind, id){
  var obj = scopeList(kind).filter(function(x){ return x.id === id; })[0];
  if(!obj) return;
  var R = document.getElementById("reMonth").value;
  if(kind === "splan"){ obj.active = true; if(R < obj.from) obj.from = R; }
  if(kind === "prov" && obj.recurring && obj.term && R > provLastMonth(obj)){
    obj.from = R; obj.startIdx = 1;
  }
  if(kind === "prov" && !obj.recurring) obj.month = R;
  if(kind === "fix"){
    var h = fixHist(obj);
    if(fixedAmount(obj, R) === null) h[R] = obj.amount || 0;
    obj.active = true;
  }
  reactivateFrom(obj, R);
  ui.month = R;
  closeSheet(); commit(tr("Reactivat din")+" " + mLabel(R));
}

/* --- ce fac cu un lucru care se repeta lunar --- */
function scopeList(kind){ return kind === "fix" ? S.fixed : kind === "splan" ? S.savings.plans : S.provisions; }

  var obj = scopeList(kind).filter(function(x){ return x.id === id; })[0];
  if(!obj) return;

  h += '<p class="hint" style="margin:-6px 2px 16px">'+tr("Se repetă în fiecare lună. Alege de unde vrei să dispară — lunile pe care nu le atingi rămân exact cum sunt.")+'</p>';
  h += '<button class="btn ghost" style="margin-bottom:8px;text-align:left" data-delscope="'+kind+'|'+id+'|month">'+
       '<b>'+tr("Doar din")+' '+esc(luna)+'</b><br><span style="font-weight:500;font-size:12.5px;opacity:.7">'+tr("Sare peste luna asta, revine luna viitoare")+'</span></button>';
  if(!isFirst){
    h += '<button class="btn ghost" style="margin-bottom:8px;text-align:left" data-delscope="'+kind+'|'+id+'|future">'+
         '<b>Din '+esc(luna)+' '+tr("înainte")+'</b><br><span style="font-weight:500;font-size:12.5px;opacity:.7">'+tr("Se oprește aici; lunile dinainte rămân neatinse")+'</span></button>';
  }
  h += '<button class="btn dang" style="text-align:left" data-delscope="'+kind+'|'+id+'|all">'+
       '<b>'+tr("Din toate lunile")+'</b><br><span style="font-weight:500;font-size:12.5px;opacity:.75">'+tr("Șterge complet, inclusiv din trecut")+'</span></button>';
  openSheet(h);
}
function removeScoped(kind, id){
  if(kind === "fix") S.fixed = S.fixed.filter(function(x){ return x.id !== id; });
  else if(kind === "splan"){
    S.savings.plans = S.savings.plans.filter(function(x){ return x.id !== id; });
    S.savings.moves = S.savings.moves.filter(function(x){ return x.planId !== id; });
  }
  else S.provisions = S.provisions.filter(function(x){ return x.id !== id; });
}
function dropPlanMoves(id, fromMonth, toMonth){
  S.savings.moves = S.savings.moves.filter(function(x){
    if(x.planId !== id) return true;
    if(x.month < fromMonth) return true;
    if(toMonth && x.month > toMonth) return true;
    return false;
  });
}
function applyDeleteScope(kind, id, scope){
  var obj = scopeList(kind).filter(function(x){ return x.id === id; })[0];
  if(!obj) return;
  var m = ui.month, msg;
  if(scope === "all"){
    removeScoped(kind, id);
    msg = tr("Șters din toate lunile");
  } else if(scope === "month"){
    addOff(obj, m, m);
    if(kind === "splan") dropPlanMoves(id, m, m);
    msg = tr("Scos doar din")+" " + mLabel(m) + " "+tr("— îl găsești în Arhivă");
  } else {
    var start = kind === "fix" ? fixedStart(obj) : (obj.from || m);
    if(m <= start){
      removeScoped(kind, id);
      msg = tr("Șters complet");
    } else {
      addOff(obj, m, null);
      if(kind === "splan") dropPlanMoves(id, m, null);
      msg = tr("Oprit din")+" " + mLabel(m) + " "+tr("— îl găsești în Arhivă");
    }
  }
  closeSheet(); commit(msg);
}

function toast(msg){

  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("on"); }, 1900);

function commit(msg){ save(); render(); if(msg) toast(msg); }

function saveExpense(id){
  var amt = parseNum(document.getElementById("fAmt").value);
  if(amt <= 0){ toast(tr("Adaugă o sumă mai mare ca zero")); return; }
  var catId = document.getElementById("fCat").value;
  var date = document.getElementById("fDate").value || dateInMonth(ui.month);
  var note = document.getElementById("fNote").value.trim();
  var provSel = document.getElementById("fProv");
  var provId = provSel ? provSel.value : "";
  learnFrom(note, catId);
  if(id){
    var e = S.expenses.filter(function(x){ return x.id===id; })[0];
    e.amount = amt; e.catId = catId; e.date = date; e.note = note;
    var back = reconcileProv(id);
    if(back.length){ closeSheet(); commit(tr("Cheltuială actualizată · {0} s-a redeschis", back[0])); return; }
  } else {
    var ne = {id:uid(), amount:amt, catId:catId, date:date, note:note, ts:Date.now()};
    S.expenses.push(ne);
    if(provId){
      var p = S.provisions.filter(function(x){ return x.id===provId; })[0];
      if(p){
        var mm = date.slice(0,7);
        p.pay = p.pay || {};
        var rec = p.pay[mm] || { ids:[], closed:false };
        rec.ids = (rec.ids || []).concat([ne.id]);
        var cv = document.getElementById("fCloseVal");
        rec.closed = !cv || cv.value === "1";
        p.pay[mm] = rec;
      }
    }
  }
  closeSheet(); commit(id ? tr("Cheltuială actualizată") : tr("Cheltuială înregistrată"));
}
/* o cheltuiala legata de un provizion s-a sters sau s-a schimbat:
   provizionul trebuie sa arate din nou realitatea, nu situatia de la inchidere */
function reconcileProv(expId){
  var reopened = [];
  S.provisions.forEach(function(p){
    if(!p.pay) return;
    Object.keys(p.pay).forEach(function(m){
      var rec = p.pay[m];
      if((rec.ids || []).indexOf(expId) === -1) return;
      /* id-uri ramase fara cheltuiala in spate */
      rec.ids = rec.ids.filter(function(x){
        return S.expenses.some(function(e){ return e.id === x; });
      });
      /* cheltuiala mutata in alta luna isi ia plata cu ea */
      var e = S.expenses.filter(function(x){ return x.id === expId; })[0];
      if(e && e.date.slice(0,7) !== m && rec.ids.indexOf(expId) !== -1){
        rec.ids = rec.ids.filter(function(x){ return x !== expId; });
        var nm = e.date.slice(0,7), r2 = p.pay[nm] || { ids:[], closed:false };
        r2.ids = (r2.ids || []).concat([expId]);
        p.pay[nm] = r2;
      }
      /* inchis, dar banii nu mai acopera provizionul -> se redeschide */
      if(rec.closed && provPaid(p, m) < p.amount){
        rec.closed = false;
        if(provActive(p, m)) reopened.push(p.name);
      }
      p.pay[m] = rec;
    });
  });
  return reopened;
}
function deleteExpense(id){
  S.expenses = S.expenses.filter(function(x){ return x.id!==id; });
  var back = reconcileProv(id);
  closeSheet();
  commit(back.length ? tr("Cheltuială ștearsă · {0} s-a redeschis", back[0]) : tr("Cheltuială ștearsă"));
}
function saveIncome(id){
  var name = document.getElementById("iName").value.trim() || tr("Venit");
  var amt = parseNum(document.getElementById("iAmt").value);
  var kind = document.getElementById("iKind").value;
  if(amt <= 0){ toast(tr("Adaugă o sumă mai mare ca zero")); return; }
  var dayEl = document.getElementById("iDay");
  var day = dayEl ? (parseInt(dayEl.value,10) || null) : null;
  if(day && (day < 1 || day > 31)) day = null;
  if(id){
    var cur = (kind==="fix" ? S.fixed : S.incomes).filter(function(x){ return x.id===id; })[0];
    if(cur){
      cur.name = name;
      if(kind==="fix"){
        var h = fixHist(cur);
        var was = fixedAmount(cur, ui.month);
        if(was !== amt) h[ui.month] = amt;   /* modificarea porneste din luna deschisa */
        cur.amount = amt; cur.day = day;
      } else cur.amount = amt;
    }
  } else if(kind==="fix"){
    var nf = {id:uid(), name:name, amount:amt, from:ui.month, active:true, day:day, hist:{}};
    nf.hist[ui.month] = amt;
    S.fixed.push(nf);
  } else {
    S.incomes.push({id:uid(), name:name, amount:amt, month:ui.month});
  }
  closeSheet(); commit(tr("Venit salvat"));
}
function saveProvision(id){
  var name = document.getElementById("pName").value.trim() || tr("Provizion");
  var amt = parseNum(document.getElementById("pAmt").value);
  if(amt <= 0){ toast(tr("Adaugă o sumă mai mare ca zero")); return; }
  var catId = document.getElementById("pCat").value;
  var day = parseInt(document.getElementById("pDay").value,10);
  var mode = document.getElementById("pRec").value;
  var rec = mode !== "once";
  var term = null, startIdx = 1;
  if(mode === "term"){
    term = parseInt(document.getElementById("pTot").value,10) || 0;
    startIdx = parseInt(document.getElementById("pIdx").value,10) || 1;
    if(term < 1){ toast(tr("Câte rate are în total?")); return; }
    if(startIdx < 1) startIdx = 1;
    if(startIdx > term){ toast(tr("Rata curentă nu poate depăși totalul")); return; }
  }
  if(id){
    var p = S.provisions.filter(function(x){ return x.id===id; })[0];
    p.name=name; p.amount=amt; p.catId=catId; p.day=day||null; p.recurring=rec;
    if(rec){
      p.term = term;
      if(term){ p.from = ui.month; p.startIdx = startIdx; }
      else if(!p.from) p.from = ui.month;
    } else { p.month = p.month || ui.month; p.term = null; }
  } else {
    S.provisions.push({id:uid(), name:name, amount:amt, catId:catId, day:day||null,
      recurring:rec, term:term, startIdx:startIdx, from:ui.month, month:ui.month, settled:{}});
  }
  closeSheet(); commit(tr("Provizion salvat"));
}
function saveBudgets(){
  var m = ui.month;
  if(!S.budgets[m]) S.budgets[m] = {};
  Array.prototype.forEach.call(sheet.querySelectorAll("[data-bud]"), function(inp){
    var id = inp.getAttribute("data-bud");
    var raw = inp.value.trim();
    var std = sheet.querySelector('[data-std="'+id+'"]').getAttribute("aria-pressed")==="true";
    if(raw===""){ delete S.budgets[m][id]; delete S.stdBudgets[id]; return; }   /* gol = fara limita, oriunde */
    var v = parseNum(raw);
    S.budgets[m][id] = v;
    if(std && v > 0) S.stdBudgets[id] = v; else delete S.stdBudgets[id];
  });
  closeSheet(); commit(tr("Bugete salvate"));
}
function saveCat(id){
  var name = document.getElementById("cName").value.trim();
  if(!name){ toast(tr("Dă un nume categoriei")); return; }
  var col = document.getElementById("cCol").value;
  var std = parseNum(document.getElementById("cStd").value);
  if(id){
    var c = S.cats.filter(function(x){ return x.id===id; })[0];
    c.name = name; c.color = col;
    if(std>0) S.stdBudgets[id] = std; else delete S.stdBudgets[id];
  } else {
    var nc = {id:uid(), name:name, color:col};
    S.cats.push(nc);
    if(std>0) S.stdBudgets[nc.id] = std;
  }
  closeSheet(); commit(tr("Categorie salvată"));
}
function deleteCat(id){
  var used = S.expenses.filter(function(e){ return e.catId===id; }).length
           + S.provisions.filter(function(p){ return p.catId===id; }).length;
  if(used && !confirm(tr("Categoria are")+" "+used+" "+tr("înregistrări. Le ștergi odată cu ea?"))) return;
  S.expenses = S.expenses.filter(function(e){ return e.catId!==id; });
  S.provisions = S.provisions.filter(function(p){ return p.catId!==id; });
  S.cats = S.cats.filter(function(c){ return c.id!==id; });
  unlearnCategory(id);
  delete S.stdBudgets[id];
  for(var m in S.budgets){ delete S.budgets[m][id]; }
  if(!S.cats.length) S.cats.push({id:uid(), name:"Altele", color:PALETTE[0]});
  closeSheet(); commit(tr("Categorie ștearsă"));
}

document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-savemove],[data-savemoveedit],[data-saveplan],[data-editbud],[data-delbud],[data-mv],[data-reactivate],[data-doreactivate],[data-openitem],[data-delscopeopen],[data-delscope],[data-delhist],[data-install],[data-nav],[data-sheet],[data-editexp],[data-editprov],[data-editfix],[data-editinc],[data-editcat],[data-save],[data-del],[data-toggle],[data-copybud],[data-payprov],[data-closeprov],[data-reopenprov],[data-copytxt],[data-restore],[data-forget],[data-reset]") : null;

  var a = function(k){ return t.getAttribute(k); };

  if(a("data-nav")){ ui.view = a("data-nav"); ui.mv = null; render(); return; }   /* tabul te duce mereu la ecranul lui de pornire */

    var s = a("data-sheet");

    else if(s==="backup") sheetBackup();
    else if(s==="restore") sheetRestore();

  }
  if(a("data-editexp")){ sheetExpense(a("data-editexp")); return; }
  if(a("data-editprov")){ sheetProvision(a("data-editprov")); return; }
  if(a("data-editfix")){ sheetIncome("fix", a("data-editfix")); return; }
  if(a("data-editinc")){ sheetIncome("var", a("data-editinc")); return; }

  if(a("data-mv")){ ui.mv = a("data-mv"); render(); return; }
  if(a("data-back")){ ui.mv = null; render(); return; }
  if(a("data-editbud")){ sheetBudgetCat(a("data-editbud")); return; }
  if(a("data-delbud")){ var db = a("data-delbud").split("|"); deleteBudget(db[0], db[1]); return; }

  if(a("data-save")){
    var k = a("data-save");
    if(k==="exp") saveExpense(a("data-id"));
    else if(k==="inc") saveIncome(a("data-id"));
    else if(k==="prov") saveProvision(a("data-id"));
    else if(k==="budget") saveBudgets();
    else if(k==="budcat") saveBudgetCat(a("data-id"));
    else if(k==="cat") saveCat(a("data-id"));
    else if(k==="svmove") saveSavingsMove(a("data-id"));
    else if(k==="svplan") saveSavingsPlan(a("data-id"));
    return;
  }
  if(a("data-del")){
    var d = a("data-del"), id = a("data-id");
    if(d==="exp") deleteExpense(id);
    else if(d==="prov"){ S.provisions = S.provisions.filter(function(x){ return x.id!==id; }); closeSheet(); commit(tr("Provizion șters")); }
    else if(d==="cat") deleteCat(id);
    else if(d==="svmove") deleteSavingsMove(id);
    else if(d==="inc"){
      if(a("data-kind")==="fix") S.fixed = S.fixed.filter(function(x){ return x.id!==id; });
      else S.incomes = S.incomes.filter(function(x){ return x.id!==id; });
      closeSheet(); commit(tr("Venit șters"));
    }
    return;
  }
  if(a("data-payprov")){ var pid = a("data-payprov"); closeSheet(); setTimeout(function(){ sheetExpense(null, pid); }, 120); return; }
  if(a("data-closeprov")){
    var cp = S.provisions.filter(function(x){ return x.id===a("data-closeprov"); })[0];
    if(cp){ cp.pay = cp.pay || {}; var r1 = cp.pay[ui.month] || {ids:[],closed:false}; r1.closed = true; cp.pay[ui.month] = r1; }
    closeSheet(); commit(tr("Provizion închis")); return;
  }
  if(a("data-reopenprov")){
    var op = S.provisions.filter(function(x){ return x.id===a("data-reopenprov"); })[0];
    if(op && op.pay && op.pay[ui.month]) op.pay[ui.month].closed = false;
    closeSheet(); commit(tr("Provizion redeschis")); return;
  }
  if(a("data-install")){
    if(deferredInstall){
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function(){ deferredInstall = null; render(); });
    }
    return;
  }
  if(a("data-savemove")){
    var dr = a("data-savemove");
    closeSheet(); setTimeout(function(){ sheetSavingsMove(dr, null); }, sheet.classList.contains("on") ? 140 : 0);
    return;
  }
  if(a("data-savemoveedit")){
    var mid = a("data-savemoveedit");
    closeSheet(); setTimeout(function(){ sheetSavingsMove(null, mid); }, 140);
    return;
  }
  if(a("data-saveplan")){
    var pid = a("data-saveplan");
    closeSheet(); setTimeout(function(){ sheetSavingsPlan(pid); }, 140);
    return;
  }
  if(a("data-reactivate")){
    var ra = a("data-reactivate").split("|");
    closeSheet(); setTimeout(function(){ sheetReactivate(ra[0], ra[1]); }, 140);
    return;
  }
  if(a("data-doreactivate")){
    var rb = a("data-doreactivate").split("|");
    doReactivate(rb[0], rb[1]);
    return;
  }
  if(a("data-openitem")){
    var oi = a("data-openitem").split("|");
    closeSheet();
    setTimeout(function(){
      if(oi[0] === "fix") sheetIncome("fix", oi[1]);
      else if(oi[0] === "splan") sheetSavingsPlan(oi[1]);
      else sheetProvision(oi[1]);
    }, 140);
    return;
  }
  if(a("data-delscopeopen")){
    var q = a("data-delscopeopen").split("|");
    closeSheet(); setTimeout(function(){ sheetDeleteScope(q[0], q[1]); }, 140);
    return;
  }
  if(a("data-delscope")){
    var w = a("data-delscope").split("|");
    applyDeleteScope(w[0], w[1], w[2]);
    return;
  }
  if(a("data-delhist")){
    var parts = a("data-delhist").split("|");
    var fh = S.fixed.filter(function(x){ return x.id===parts[0]; })[0];
    if(fh && fh.hist && Object.keys(fh.hist).length > 1){
      delete fh.hist[parts[1]];
      fh.amount = fixedAmount(fh, ui.month);
      closeSheet(); commit(tr("Modificare ștearsă din istoric"));
    }
    return;
  }
  if(a("data-toggle")==="carry"){ S.carry = !S.carry; commit(S.carry?tr("Report activat"):tr("Report dezactivat")); return; }
  if(a("data-copybud")){
    var prev = shiftM(ui.month,-1), src = S.budgets[prev];
    if(!src || !Object.keys(src).length){ toast(tr("Luna trecută nu are bugete setate")); return; }
    S.budgets[ui.month] = JSON.parse(JSON.stringify(src));
    commit(tr("Bugete copiate din")+" "+mLabel(prev)); return;
  }
  if(a("data-dlbackup")){
    try{
      var blob = new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url; link.download = "sold-lunar-backup-" + todayISO() + ".json";
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast(tr("Backup descărcat"));
    }catch(e){ toast(tr("Copiază textul manual")); }
    return;
  }
  if(a("data-copytxt")){
    var ta = document.getElementById(a("data-copytxt"));
    ta.select(); ta.setSelectionRange(0, 999999);
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value); }
      else { document.execCommand("copy"); }
      toast("Copiat");
    }catch(e){ toast(tr("Selectează textul și copiază manual")); }
    return;
  }
  if(a("data-restore")){
    try{
      var obj = JSON.parse(document.getElementById("rsTxt").value);
      if(!obj || !obj.cats) throw new Error("bad");
      S = obj;
      ["fixed","incomes","expenses","provisions"].forEach(function(kk){ if(!Array.isArray(S[kk])) S[kk]=[]; });
      if(!S.budgets) S.budgets={}; if(!S.stdBudgets) S.stdBudgets={};
      closeSheet(); commit(tr("Date restaurate"));
    }catch(e){ toast(tr("Textul nu pare o copie validă")); }
    return;
  }
  if(a("data-forget")){
    S.learn = {};
    commit(tr("Am uitat categoriile învățate")); return;
  }
  if(a("data-reset")){
    if(confirm(tr("Ștergi definitiv toate veniturile, cheltuielile, provizioanele și bugetele din acest browser?"))){
      S = seed(); closeSheet(); commit(tr("Datele au fost șterse"));
    }
    return;
  }
});

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault(); deferredInstall = e;
  if(ui.view === "settings") render();
});
window.addEventListener("appinstalled", function(){ deferredInstall = null; if(ui.view === "settings") render(); });

document.getElementById("backBtn").addEventListener("click", function(){ ui.mv = null; render(); });
document.getElementById("prevM").addEventListener("click", function(){ ui.month = shiftM(ui.month,-1); render(); });
document.getElementById("nextM").addEventListener("click", function(){ ui.month = shiftM(ui.month,1); render(); });
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if(sheet.classList.contains("on")){ closeSheet(); return; }
  if(ui.view === "list" && ui.mv){ ui.mv = null; render(); }
});

/* theme */
function applyTheme(){
  if(S.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
}
document.getElementById("langBtn").addEventListener("click", function(){
  var oldLang = LG;
  S.lang = (S.lang === "en") ? "ro" : "en";
  applyLang();
  /* categoriile implicite pe care nu le-ai redenumit trec si ele in limba noua */
  S.cats.forEach(function(c){
    var nm = c.key && CAT_NAMES[c.key];
    if(!nm) return;
    if(normTxt(c.name) === normTxt(nm[oldLang] || nm.ro)) c.name = catName(c.key);
  });
  save(); render();
  toast(tr("Limba: română"));
});
document.getElementById("themeBtn").addEventListener("click", function(){
  S.theme = S.theme==="auto" ? "dark" : S.theme==="dark" ? "light" : "auto";
  applyTheme(); save();
  toast(S.theme==="auto" ? tr("Temă: automat") : S.theme==="dark" ? tr("Temă: întunecat") : tr("Temă: luminos"));
});
applyLang();
applyTheme();

/* daca aplicatia ramane deschisa peste miezul noptii, reimprospatez la revenire */
var lastSeenDay = todayISO();
function refreshIfNewDay(){
  var t = todayISO();
  if(t !== lastSeenDay){ lastSeenDay = t; render(); }
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) refreshIfNewDay(); });
window.addEventListener("focus", refreshIfNewDay);
setInterval(refreshIfNewDay, 60000);

render();

/* expose for self-test */
window.__app = {
  get S(){ return S; }, set S(v){ S=v; },
  ui:ui, balance:balance, totalIncome:totalIncome, totalExpense:totalExpense,
  totalOpenProv:totalOpenProv, byCategory:byCategory, budgetOf:budgetOf,
  provisionsFor:provisionsFor, provLastMonth:provLastMonth, provIdx:provIdx, provActive:provActive,
  provRemaining:provRemaining, provDelta:provDelta, provPaid:provPaid, provState:provState,
  reconcileProv:reconcileProv,
  parseNum:parseNum, tr:tr, applyLang:applyLang,
  prevWorkday:prevWorkday, salaryDate:salaryDate, isWeekendDay:isWeekendDay,
  savingsBalance:savingsBalance, savingsAvailAt:savingsAvailAt, savingsNet:savingsNet, saveSavingsMove:saveSavingsMove, plannedSavings:plannedSavings,
  plannedSavingsNet:plannedSavingsNet, savingsCommitted:savingsCommitted, savingsMovesFor:savingsMovesFor, materializeSavings:materializeSavings,
  realBalance:realBalance, receivedIncome:receivedIncome, spentSoFar:spentSoFar,
  carryPending:carryPending, curMonth:curMonth, carryInto:carryInto, fixedLive:fixedLive, archivedItems:archivedItems, reactivateFrom:reactivateFrom, isOff:isOff, addOff:addOff, applyDeleteScope:applyDeleteScope, fixedAmount:fixedAmount, fixedStart:fixedStart, fixedChanges:fixedChanges, fixedFor:fixedFor,
  nextSalary:nextSalary, provisionsDueBy:provisionsDueBy, dateForDay:dateForDay,
  guessCategory:guessCategory, learnFrom:learnFrom, normTxt:normTxt,
  uid:uid, seed:seed, render:render, save:save
};
})();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>

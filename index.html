<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Buget personal: venituri, cheltuieli pe categorii, provizioane si bugete lunare.">
<meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sold Lunar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sold Lunar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#EDF0F5; --line:#E0E4EC;
  --text:#11151C; --muted:#5F6879; --faint:#949CAC;
  --accent:#0E8C82; --accent-ink:#0A6B63; --accent-soft:#DCEFEC; --on-accent:#FFFFFF;
  --ok:#2E8B51; --ok-soft:#DFF0E4;
  --warn:#B5721A; --warn-soft:#F7EBD8;
  --danger:#C2413A; --danger-soft:#F8E3E1;
  --shadow:0 1px 2px rgba(16,20,30,.05), 0 10px 28px -16px rgba(16,20,30,.28);
  --radius:16px;
  --ff:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fm:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F13; --surface:#151A20; --surface2:#1D242C; --line:#2A333E;
    --text:#E8EDF3; --muted:#95A0B0; --faint:#68727F;
    --accent:#2FB6A5; --accent-ink:#8FE0D5; --accent-soft:#10312E; --on-accent:#04110F;
    --ok:#57BC7F; --ok-soft:#132B1D;
    --warn:#DDA455; --warn-soft:#2E2415;
    --danger:#E97B72; --danger-soft:#331A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F13; --surface:#151A20; --surface2:#1D242C; --line:#2A333E;
  --text:#E8EDF3; --muted:#95A0B0; --faint:#68727F;
  --accent:#2FB6A5; --accent-ink:#8FE0D5; --accent-soft:#10312E; --on-accent:#04110F;
  --ok:#57BC7F; --ok-soft:#132B1D;
  --warn:#DDA455; --warn-soft:#2E2415;
  --danger:#E97B72; --danger-soft:#331A18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--ff); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- shell ---------- */
.app{max-width:540px;margin:0 auto;padding:0 14px 108px}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding:10px 0 8px;
}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.iconbtn:hover{color:var(--text)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:5px 6px}
.monthnav button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.monthnav button:hover{background:var(--surface2);color:var(--text)}
.monthnav .label{font-weight:700;letter-spacing:-.01em;flex:1;text-align:center}
.monthnav .label span{display:block;font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-top:-2px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 2px}
.sect h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0}
.sect button{font-size:13px;font-weight:600;color:var(--accent-ink)}

.balance{padding:20px 18px 16px;position:relative;overflow:hidden}
.balance .lbl{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.balance .big{font-size:40px;font-weight:600;line-height:1.05;margin:6px 0 2px;letter-spacing:-.035em}
.balance .big.neg{color:var(--danger)}
.balance .sub{font-size:13px;color:var(--muted)}
.breakdown{display:flex;flex-direction:column;gap:1px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.brow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.brow .k{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted)}
.brow .k i{width:8px;height:8px;border-radius:3px;display:block;font-style:normal}
.brow .v{font-size:14px;font-weight:600}
.brow.tap{cursor:pointer;border-radius:8px;margin:0 -6px;padding:6px}
.brow.tap:hover{background:var(--surface2)}

.nextpay{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.np-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);line-height:1.35}
.np-row i{width:6px;height:6px;border-radius:50%;flex:none}
.np-row b{color:var(--text);font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex;margin-top:12px}
.meter i{display:block;height:100%}

/* ---------- lists ---------- */
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;width:100%;text-align:left}
.row + .row{margin-top:8px}
.stack > .row + .row{margin-top:0}
.stack > .bud + .bud{margin-top:0}
.row:hover{border-color:var(--accent)}
.chip{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;letter-spacing:-.02em}
.row .main{flex:1;min-width:0;display:block}
.row .t{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt,.row .pill{white-space:nowrap}
.row .amt{font-weight:600;font-size:15px;flex:none}
.row .amt.in{color:var(--ok)}
.row .mini{display:block;height:3px;border-radius:99px;background:var(--surface2);margin-top:7px;overflow:hidden}
.row .mini i{display:block;height:100%;border-radius:99px}
.row .cnt{font-family:var(--fm);font-size:11px;font-weight:600;padding:2px 7px;border-radius:7px;background:var(--surface2);color:var(--muted);letter-spacing:-.02em;flex:none}
.daysep{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:18px 4px 8px}
.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:26px 16px;border:1px dashed var(--line);border-radius:var(--radius)}

.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.mut{background:var(--surface2);color:var(--muted)}

/* ---------- budget block ---------- */
.bud{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.bud + .bud{margin-top:8px}
.bud .top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bud .nm{font-weight:600;flex:1}
.bud .pct{font-family:var(--fm);font-weight:600;font-size:15px}
.bud .legend{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.inp{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:11px;padding:12px 13px;font-size:15.5px}
.inp:focus{background:var(--surface);border-color:var(--accent);outline:none}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.inp.money{font-family:var(--fm);font-size:26px;font-weight:600;text-align:right;padding:14px 15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 > .btn{font-size:13.5px;padding:12px 8px}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:14px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{width:100%;padding:14px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;letter-spacing:-.01em}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.dang{background:var(--danger-soft);color:var(--danger)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.switch small{display:block;color:var(--faint);font-size:12.5px;font-weight:500}
.tog{width:46px;height:27px;border-radius:99px;background:var(--surface2);position:relative;flex:none;transition:background .16s}
.tog i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .16s}
.tog[aria-pressed="true"]{background:var(--accent)}
.tog[aria-pressed="true"] i{transform:translateX(19px)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,11,16,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:540px;margin:0 auto;
  background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;transform:translateY(102%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -12px 40px -12px rgba(0,0,0,.35);
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:800;letter-spacing:-.02em}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.tog,.tog i{transition:none}}

/* ---------- nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:540px;margin:0 auto;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.01em}
.nav button[aria-current="true"]{color:var(--accent-ink)}
.nav svg{width:21px;height:21px}
.fab{
  position:fixed;z-index:41;right:max(16px,calc(50vw - 254px));bottom:calc(78px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(14,140,130,.55);
}
.fab svg{width:26px;height:26px}

/* ---------- report ---------- */
.bars{display:flex;align-items:flex-end;gap:7px;height:104px;margin:6px 0 10px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b i{width:100%;background:var(--surface2);border-radius:6px 6px 3px 3px;min-height:3px;display:block}
.bars .b.cur i{background:var(--accent)}
.bars .b em{font-style:normal;font-size:10px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .k{background:var(--surface2);border-radius:12px;padding:11px 12px}
.kpi .k b{display:block;font-family:var(--fm);font-size:17px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.kpi .k span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tot{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 2px;border-top:1px solid var(--line);margin-top:10px;font-weight:700}
.hint{font-size:12.5px;color:var(--faint);line-height:1.5;margin:10px 2px 0}
.toast{position:fixed;left:50%;bottom:96px;white-space:nowrap;transform:translate(-50%,14px);z-index:90;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet-open .toast{bottom:auto;top:74px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandrow">
      <div class="brand"><span class="dot"></span><span>Sold Lunar<small>buget personal</small></span></div>
      <button class="iconbtn" id="themeBtn" aria-label="Schimbă tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
    <div class="monthnav">
      <button id="prevM" aria-label="Luna anterioară"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="label" id="mLabel"></div>
      <button id="nextM" aria-label="Luna următoare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Adaugă">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="nav" id="nav"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============ state ============ */
var KEY = "sold-lunar-v1";
var PALETTE = ["#0E8C82","#C2413A","#7B5BD6","#B5721A","#2E8B51","#C4477F","#3B72D6","#8A7A2E","#D06A2B","#5A6B7B"];
var DEFAULT_CATS = ["Mâncare","Utilități","Transport","Rate bancare","Abonamente","Beauty","Vicii","Sănătate","Divertisment","Altele"];

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function seed(){
  var cats = DEFAULT_CATS.map(function(n,i){ return {id:uid(), name:n, color:PALETTE[i % PALETTE.length]}; });
  return { cats:cats, fixed:[], incomes:[], expenses:[], provisions:[], budgets:{}, stdBudgets:{}, learn:{}, carry:true, carrySet:true, theme:"auto" };
}
var storageOK = (function(){
  try{ var k="__t"+Date.now(); localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
var memStore = null;
function load(){
  try{
    if(!storageOK) return memStore || seed();
    var raw = localStorage.getItem(KEY);
    if(!raw) return seed();
    var s = JSON.parse(raw);
    if(!s || !s.cats || !s.cats.length) return seed();
    ["fixed","incomes","expenses","provisions"].forEach(function(k){ if(!Array.isArray(s[k])) s[k]=[]; });
    if(!s.budgets) s.budgets={}; if(!s.stdBudgets) s.stdBudgets={}; if(!s.learn) s.learn={};
    migrate(s);
    return s;
  }catch(e){ return seed(); }
}
/* transforma vechile campuri skip/until in perioade de pauza */
function migrateOff(o){
  if(!Array.isArray(o.off)) o.off = [];
  if(o.skip){
    for(var k in o.skip){ if(o.skip[k]) o.off.push({ from:k, until:k }); }
    delete o.skip;
  }
  if(o.until){ o.off.push({ from: shiftM(o.until, 1), until: null }); delete o.until; }
}
function migrate(s){
  if(s.carrySet !== true){ s.carry = true; s.carrySet = true; }   /* pornit implicit, o singura data */
  (s.fixed||[]).concat(s.provisions||[]).forEach(migrateOff);
  (s.fixed||[]).forEach(function(f){
    if(!f.hist || typeof f.hist !== "object"){
      f.hist = {};
      f.hist[f.from || "2000-01"] = f.amount || 0;
    }
  });
  (s.provisions||[]).forEach(function(p){
    if(!p.pay) p.pay = {};
    if(p.settled){
      for(var m in p.settled){
        if(!p.pay[m]) p.pay[m] = { ids:[p.settled[m]], closed:true };
      }
      delete p.settled;
    }
  });
}
function save(){
  memStore = S;
  if(!storageOK) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; }
}

var S = load();
var ui = { month: mk(new Date()), view: "home" };
var deferredInstall = null;

/* ============ helpers ============ */
var MONTHS = ["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
var MSHORT = ["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","noi","dec"];
var DAYS = ["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];

function pad(n){ return n<10 ? "0"+n : ""+n; }
function mk(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function mLabel(m){ var p=m.split("-"); return MONTHS[+p[1]-1]+" "+p[0]; }
function mShort(m){ var p=m.split("-"); return MSHORT[+p[1]-1]; }
function shiftM(m,k){ var p=m.split("-"); var d=new Date(+p[0], +p[1]-1+k, 1); return mk(d); }
function mDiff(a,b){ var x=a.split("-"), y=b.split("-"); return (+y[0]-+x[0])*12 + (+y[1]-+x[1]); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dateInMonth(m){ var t=todayISO(); return t.slice(0,7)===m ? t : m+"-01"; }
function dayLabel(iso){
  var p=iso.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]);
  if(iso===todayISO()) return "Azi";
  return DAYS[d.getDay()]+", "+(+p[2])+" "+MSHORT[+p[1]-1];
}
var NF = new Intl.NumberFormat("ro-RO",{minimumFractionDigits:2, maximumFractionDigits:2});
var NF0 = new Intl.NumberFormat("ro-RO",{maximumFractionDigits:0});
function lei(n){ return NF.format(Math.round((n||0)*100)/100)+" lei"; }
function leiShort(n){ return NF0.format(Math.round(n||0))+" lei"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function parseNum(v){ if(v==null) return 0; var n=parseFloat(String(v).replace(/\s/g,"").replace(",",".")); return isFinite(n)?n:0; }
function cat(id){ for(var i=0;i<S.cats.length;i++){ if(S.cats[i].id===id) return S.cats[i]; } return {id:id,name:"Fără categorie",color:"#5A6B7B"}; }
function initials(n){ var w=String(n).trim().split(/\s+/); return (w[0]?w[0][0]:"?").toUpperCase(); }
function tint(hex,a){ var h=hex.replace("#",""); var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return "rgba("+r+","+g+","+b+","+a+")"; }

/* ============ calculations ============ */
function fixHist(f){
  if(!f.hist || typeof f.hist !== "object"){ f.hist = {}; f.hist[f.from || "2000-01"] = f.amount || 0; }
  return f.hist;
}
/* suma valabila in luna m = ultima modificare facuta pana in luna aceea */
function fixedAmount(f, m){
  var h = fixHist(f), best = null;
  for(var k in h){ if(k <= m && (best === null || k > best)) best = k; }
  return best === null ? null : h[best];
}
function fixedStart(f){
  var h = fixHist(f), best = null;
  for(var k in h){ if(best === null || k < best) best = k; }
  return best;
}
function fixedChanges(f){
  var h = fixHist(f), keys = [];
  for(var k in h) keys.push(k);
  keys.sort();
  return keys.map(function(k){ return { month:k, amount:h[k] }; });
}
function offSpans(o){ if(!Array.isArray(o.off)) migrateOff(o); return o.off; }
function isOff(o, m){
  var sp = offSpans(o);
  for(var i=0;i<sp.length;i++){
    if(sp[i].from <= m && (sp[i].until === null || m <= sp[i].until)) return true;
  }
  return false;
}
function offReason(o, m){
  var sp = offSpans(o);
  for(var i=0;i<sp.length;i++){
    var q = sp[i];
    if(q.from <= m && (q.until === null || m <= q.until)){
      if(q.until === null) return "oprit din " + mLabel(q.from);
      if(q.from === q.until) return "sărit peste " + mLabel(q.from);
      return "pauză " + mLabel(q.from) + " – " + mLabel(q.until);
    }
  }
  return null;
}
function addOff(o, from, until){
  offSpans(o).push({ from: from, until: until === undefined ? null : until });
}
/* reactiveaza din luna R inainte: taie orice pauza care ar acoperi R sau ce urmeaza */
function reactivateFrom(o, R){
  var sp = offSpans(o), keep = [];
  sp.forEach(function(q){
    if(q.from >= R) return;                                  // pauza incepe dupa R -> dispare
    if(q.until === null || q.until >= R) q.until = shiftM(R, -1);  // se opreste inainte de R
    if(q.until >= q.from) keep.push(q);
  });
  o.off = keep;
}
function fixedLive(f, m){
  if(f.active === false) return false;
  if(isOff(f, m)) return false;
  return fixedAmount(f, m) !== null;
}
function fixedFor(m){
  return S.fixed.filter(function(f){ return fixedLive(f, m); });
}
function incomesFor(m){ return S.incomes.filter(function(i){ return i.month===m; }); }
function totalIncome(m){
  var t=0;
  fixedFor(m).forEach(function(f){ t += fixedAmount(f, m); });
  incomesFor(m).forEach(function(i){ t+=i.amount; });
  return t;
}
function expensesFor(m){ return S.expenses.filter(function(e){ return e.date.slice(0,7)===m; }); }
function totalExpense(m){ var t=0; expensesFor(m).forEach(function(e){ t+=e.amount; }); return t; }

/* provizioane: rata curenta, numar total de rate, activitate pe luna */
function provIdx(p,m){ return (p.startIdx||1) + mDiff(p.from||m, m); }
function provLastMonth(p){ if(!p.term) return null; return shiftM(p.from||ui.month, p.term - (p.startIdx||1)); }
function provActive(p,m){
  if(!p.recurring) return p.month === m && !isOff(p, m);
  if(isOff(p, m)) return false;
  if(m < (p.from||m)) return false;
  if(p.term){ var i = provIdx(p,m); return i >= 1 && i <= p.term; }
  return true;
}
function provFinished(p){ return !!(p.recurring && p.term && !provActive(p, ui.month) && ui.month > (p.from||ui.month)); }

/* plati inregistrate pe un provizion intr-o luna */
function provRec(p,m){ return (p.pay && p.pay[m]) || { ids:[], closed:false }; }
function provPayments(p,m){
  var ids = provRec(p,m).ids || [];
  return S.expenses.filter(function(e){ return ids.indexOf(e.id) !== -1; });
}
function provPaid(p,m){ var t=0; provPayments(p,m).forEach(function(e){ t+=e.amount; }); return t; }
function provRemaining(p,m){
  if(provRec(p,m).closed) return 0;
  return Math.max(0, Math.round((p.amount - provPaid(p,m))*100)/100);
}
function provState(p,m){
  if(provRec(p,m).closed) return "closed";
  return provPaid(p,m) > 0 ? "partial" : "open";
}

/* provizioane active in luna m, cu starea de achitare */
function provisionsFor(m){
  return S.provisions.filter(function(p){
    return provActive(p, m);
  }).map(function(p){
    return { p:p, state: provState(p,m), paid: provPaid(p,m), remaining: provRemaining(p,m),
             settled: provRemaining(p,m) <= 0, idx: p.recurring ? provIdx(p,m) : null };
  });
}
function openProvisions(m){ return provisionsFor(m).filter(function(x){ return x.remaining > 0; }); }
function totalOpenProv(m){ var t=0; openProvisions(m).forEach(function(x){ t+=x.remaining; }); return t; }

/* ---- ziua de incasare a venitului fix ---- */
function dateForDay(m, day){
  var q = m.split("-");
  var last = new Date(+q[0], +q[1], 0).getDate();
  return new Date(+q[0], +q[1]-1, Math.min(day, last));
}
function startOfToday(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function daysBetween(a,b){ return Math.round((b - a) / 86400000); }

function nextSalary(){
  var today = startOfToday();
  var best = null;
  S.fixed.forEach(function(f){
    if(f.active === false || !f.day) return;
    for(var k=0; k<2; k++){
      var mm = shiftM(mk(today), k);
      if(!fixedLive(f, mm)) continue;
      var d = dateForDay(mm, f.day);
      if(d >= today){ if(!best || d < best.date) best = { date:d, f:f, month:mm }; break; }
    }
  });
  return best;
}
function provisionsDueBy(endDate){
  var today = startOfToday(), res = [];
  var months = [mk(today)];
  var em = mk(endDate); if(months.indexOf(em) === -1) months.push(em);
  months.forEach(function(m){
    provisionsFor(m).forEach(function(x){
      if(!x.p.day || x.remaining <= 0) return;
      var d = dateForDay(m, x.p.day);
      if(d >= today && d <= endDate) res.push({ x:x, date:d });
    });
  });
  return res;
}

function firstMonth(){
  var all=[];
  S.expenses.forEach(function(e){ all.push(e.date.slice(0,7)); });
  S.incomes.forEach(function(i){ all.push(i.month); });
  S.provisions.forEach(function(p){ all.push(p.recurring ? (p.from||ui.month) : p.month); });
  S.fixed.forEach(function(f){ var st = fixedStart(f); if(st && st !== "2000-01") all.push(st); });
  all.push(ui.month);
  all.sort();
  return all[0];
}
function curMonth(){ return mk(new Date()); }
/* reportul se stie doar daca toate lunile dinaintea lui m s-au incheiat */
function carryPending(m){ return S.carry && m > curMonth(); }
function carryInto(m){
  if(!S.carry) return 0;
  if(m > curMonth()) return 0;      /* luna dinainte inca nu s-a incheiat */
  var start = firstMonth();
  if(m <= start) return 0;
  var bal = 0, cur = start, guard = 0;
  while(cur < m && guard++ < 400){
    bal = bal + totalIncome(cur) - totalExpense(cur) - totalOpenProv(cur);
    cur = shiftM(cur,1);
  }
  return bal;
}
function balance(m){ return carryInto(m) + totalIncome(m) - totalExpense(m) - totalOpenProv(m); }

function byCategory(m){
  var map = {};
  expensesFor(m).forEach(function(e){
    if(!map[e.catId]) map[e.catId] = {catId:e.catId, spent:0, prov:0, n:0};
    map[e.catId].spent += e.amount; map[e.catId].n++;
  });
  openProvisions(m).forEach(function(x){
    var c = x.p.catId; if(!c) return;
    if(!map[c]) map[c] = {catId:c, spent:0, prov:0, n:0};
    map[c].prov += x.remaining;
  });
  var arr = [];
  for(var k in map) arr.push(map[k]);
  arr.sort(function(a,b){ return (b.spent+b.prov)-(a.spent+a.prov); });
  return arr;
}
function budgetOf(m, catId){
  var mb = S.budgets[m];
  if(mb && mb[catId] != null) return mb[catId];
  if(S.stdBudgets[catId] != null) return S.stdBudgets[catId];
  return null;
}
function budgetedCats(m){
  return S.cats.filter(function(c){ return budgetOf(m,c.id) != null && budgetOf(m,c.id) > 0; });
}

function normTxt(s){
  return String(s||"").toLowerCase()
    .replace(/[ăâ]/g,"a").replace(/î/g,"i").replace(/[șş]/g,"s").replace(/[țţ]/g,"t")
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function catIdByName(name){
  for(var i=0;i<S.cats.length;i++){ if(normTxt(S.cats[i].name) === normTxt(name)) return S.cats[i].id; }
  return null;
}
function catExists(id){ for(var i=0;i<S.cats.length;i++){ if(S.cats[i].id===id) return true; } return false; }

function learnFrom(note, catId){
  var t = normTxt(note);
  if(!t || !catId) return;
  S.learn = S.learn || {};
  function bump(k){
    if(!S.learn[k]) S.learn[k] = {};
    S.learn[k][catId] = (S.learn[k][catId] || 0) + 1;
  }
  bump("=" + t);
  t.split(" ").forEach(function(w){ if(w.length >= 3) bump(w); });
  /* curatenie: daca s-au adunat prea multe chei, le scot pe cele folosite o singura data */
  var keys = Object.keys(S.learn);
  if(keys.length > 600){
    keys.forEach(function(k){
      var tot = 0, m = S.learn[k];
      for(var c in m) tot += m[c];
      if(tot <= 1) delete S.learn[k];
    });
  }
}
function unlearnCategory(catId){
  if(!S.learn) return;
  Object.keys(S.learn).forEach(function(k){
    delete S.learn[k][catId];
    if(!Object.keys(S.learn[k]).length) delete S.learn[k];
  });
}
function guessCategory(note){
  var t = normTxt(note);
  if(!t) return null;
  var words = t.split(" ").filter(function(w){ return w.length >= 3; });
  var scores = {}, c;

  function add(key, weight){
    var m = S.learn && S.learn[key];
    if(!m) return;
    for(var k in m){ if(catExists(k)) scores[k] = (scores[k] || 0) + m[k] * weight; }
  }
  add("=" + t, 100);
  words.forEach(function(w){ add(w, 3); });

  var best = null, bs = 0;
  for(c in scores){ if(scores[c] > bs){ bs = scores[c]; best = c; } }
  if(best) return best;

  /* fara istoric: dictionarul de pornire */
  var seedScore = {};
  for(var name in SEED){
    var id = catIdByName(name);
    if(!id) continue;
    SEED[name].forEach(function(kw){
      if(t.indexOf(kw) !== -1) seedScore[id] = (seedScore[id] || 0) + kw.length;
    });
  }
  best = null; bs = 0;
  for(c in seedScore){ if(seedScore[c] > bs){ bs = seedScore[c]; best = c; } }
  return best;
}

    '<div class="sub">'+esc(mLabel(m))+

    h += provisionsFor(m).sort(function(a,b){ return (a.state==="closed"?1:0)-(b.state==="closed"?1:0) || (a.p.day||99)-(b.p.day||99); }).map(function(x){

      var kind = term ? ("rata "+x.idx+"/"+x.p.term) : (x.p.recurring ? "lunar, nelimitat" : "o singură dată");
      var sub = x.state === "partial"
        ? ("achitat " + NF0.format(Math.round(x.paid)) + " din " + leiShort(x.p.amount) + (x.p.day ? (" · pe " + x.p.day) : ""))
        : (kind + (x.p.day ? (" · scadent pe " + x.p.day) : "") + (c ? " · " + c.name : ""));
      var right = x.state === "closed"
        ? '<span class="pill ok">închis</span>'
        : '<span class="amt num">−'+esc(lei(x.remaining))+'</span>';
      return '<button class="row" data-editprov="'+x.p.id+'">'+
        '<span class="chip" style="background:'+tint(col,.14)+';color:'+col+'">'+esc(c?initials(c.name):"P")+'</span>'+

}
function salaryStrip(m){
  if(m !== mk(new Date())) return "";
  var ns = nextSalary();
  if(!ns) return "";
  var d = daysBetween(startOfToday(), ns.date);
  var when = d === 0 ? "azi" : d === 1 ? "mâine" : "în " + d + " zile";
  var dateTxt = ns.date.getDate() + " " + MONTHS[ns.date.getMonth()].toLowerCase();
  var due = provisionsDueBy(ns.date);
  var sum = 0; due.forEach(function(q){ sum += q.x.remaining; });
  var second = "";
  if(due.length){

function brow(color,label,val,tag){
  var sign = val<0 ? "−" : "";
  return '<div class="brow"><span class="k"><i style="background:'+color+'"></i>'+esc(label)+'</span>'+
    '<span class="v num">'+sign+esc(lei(Math.abs(val)))+'</span></div>';
}
function expRow(e){
  var c = cat(e.catId);
  return '<button class="row" data-editexp="'+e.id+'">'+
    '<span class="chip" style="background:'+tint(c.color,.14)+';color:'+c.color+'">'+esc(initials(c.name))+'</span>'+
    '<span class="main"><span class="t">'+esc(e.note || c.name)+'</span>'+
    '<span class="s">'+esc(c.name)+' · '+esc(dayLabel(e.date))+'</span></span>'+
    '<span class="amt num">−'+esc(lei(e.amount))+'</span></button>';
}
function budRow(m,c){
  var b = budgetOf(m,c.id) || 0;
  var agg = byCategory(m).filter(function(x){ return x.catId===c.id; })[0] || {spent:0,prov:0};
  var pctSpent = b>0 ? (agg.spent/b*100) : 0;
  var pctProv  = b>0 ? (agg.prov/b*100) : 0;
  var used = pctSpent + pctProv;
  var rest = b - agg.spent - agg.prov;
  var cls = used>=100 ? "danger" : used>=80 ? "warn" : "ok";
  return '<div class="bud"><div class="top">'+
    '<span class="chip" style="width:26px;height:26px;border-radius:9px;font-size:11px;background:'+tint(c.color,.14)+';color:'+c.color+'">'+esc(initials(c.name))+'</span>'+
    '<span class="nm">'+esc(c.name)+'</span>'+
    '<span class="pct" style="color:var(--'+cls+')">'+Math.round(used)+'%</span></div>'+
    '<div class="meter"><i style="width:'+Math.min(100,pctSpent)+'%;background:'+c.color+'"></i>'+
    '<i style="width:'+Math.min(Math.max(0,100-pctSpent),pctProv)+'%;background:'+tint(c.color,.38)+'"></i></div>'+
    '<div class="legend"><span class="num">'+esc(leiShort(agg.spent+agg.prov))+' / '+esc(leiShort(b))+'</span>'+
    '<span style="color:var(--'+cls+')">'+(rest>=0 ? "mai ai "+leiShort(rest)+" ("+Math.max(0,Math.round(100-used))+"%)" : "depășit cu "+leiShort(-rest))+'</span></div>'+
    (agg.prov>0 ? '<div class="hint" style="margin-top:6px">include '+esc(leiShort(agg.prov))+' provizionat</div>' : '')+
    '</div>';
}

      '<div style="display:flex;align-items:center;gap:10px">'+

      '<span style="display:block;font-size:12.5px;color:var(--faint)">'+r.n+' '+(r.n===1?"cheltuială":"cheltuieli")+' · '+Math.round(share)+'% din total'+(b?" · buget "+leiShort(b):"")+'</span></span>'+
      '<span class="num" style="font-weight:600">'+esc(lei(r.spent))+'</span></div>'+

/* ============ sheet ============ */
var sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
function openSheet(html){
  sheet.innerHTML = '<div class="grab"></div>' + html;
  scrim.classList.add("on"); sheet.classList.add("on"); document.body.classList.add("sheet-open");
  var f = sheet.querySelector("[data-focus]"); if(f) setTimeout(function(){ f.focus(); }, 240);
}
function closeSheet(){ scrim.classList.remove("on"); sheet.classList.remove("on"); document.body.classList.remove("sheet-open"); }
scrim.addEventListener("click", closeSheet);

function catOptions(sel){
  return S.cats.map(function(c){ return '<option value="'+c.id+'"'+(c.id===sel?" selected":"")+'>'+esc(c.name)+'</option>'; }).join("");
}
function moneyField(label, id, val){
  return '<label class="f"><span>'+label+'</span><input class="inp money" id="'+id+'" inputmode="decimal" value="'+(val!=null?Number(val).toFixed(2).replace(".",","):"")+'" placeholder="0,00"></label>';
}

/* --- expense sheet --- */
function sheetExpense(id, presetProvId){
  var e = id ? S.expenses.filter(function(x){ return x.id===id; })[0] : null;
  var open = openProvisions(ui.month);
  var h = '<h3>'+(e?"Editează cheltuiala":"Cheltuială nouă")+'</h3>';
  if(!e && open.length){
    h += '<label class="f"><span>Din provizion (opțional)</span><select class="inp" id="fProv"><option value="">— cheltuială nouă —</option>'+
      open.map(function(x){ return '<option value="'+x.p.id+'"'+(x.p.id===presetProvId?" selected":"")+'>'+esc(x.p.name)+' · rest '+esc(leiShort(x.remaining))+'</option>'; }).join("")+
      '</select></label>';
  }
  h += '<label class="f"><span>Descriere</span><input class="inp" id="fNote" data-focus placeholder="ex. parfum, benzină, țigări" value="'+esc(e?e.note:"")+'"></label>';
  h += '<label class="f" style="margin-bottom:6px"><span>Categorie</span><select class="inp" id="fCat">'+catOptions(e?e.catId:null)+'</select></label>'+
       '<p class="hint" id="catHint" hidden style="margin:0 2px 14px"></p>';
  h += moneyField("Sumă", "fAmt", e?e.amount:null);
  h += '<label class="f"><span>Data</span><input class="inp" type="date" id="fDate" value="'+(e?e.date:dateInMonth(ui.month))+'"></label>';
  if(!e && open.length){
    h += '<div id="fCloseBox" hidden><span style="display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:6px">După această plată</span>'+
      '<div class="seg"><button type="button" data-cls="1" aria-pressed="true">Închide provizionul</button>'+
      '<button type="button" data-cls="0" aria-pressed="false">Îl las deschis</button></div>'+
      '<p class="hint" id="fCloseHint" style="margin:-6px 2px 14px"></p></div>'+
      '<input type="hidden" id="fCloseVal" value="1">';
  }
  h += '<button class="btn" data-save="exp" data-id="'+(e?e.id:"")+'">'+(e?"Salvează":"Adaugă cheltuiala")+'</button>';
  if(e) h += '<button class="btn dang" style="margin-top:8px" data-del="exp" data-id="'+e.id+'">Șterge</button>';
  openSheet(h);

  var noteEl = document.getElementById("fNote"), catEl = document.getElementById("fCat"),
      catHint = document.getElementById("catHint"), catTouched = !!e;
  if(noteEl && catEl){
    catEl.addEventListener("change", function(){ catTouched = true; if(catHint) catHint.hidden = true; });
    var tmr = null;
    noteEl.addEventListener("input", function(){
      if(catTouched) return;
      clearTimeout(tmr);
      tmr = setTimeout(function(){
        var g = guessCategory(noteEl.value);
        if(g && g !== catEl.value){
          catEl.value = g;
          catHint.hidden = false;
          catHint.textContent = "Categorie propusă: " + cat(g).name + ". Schimb-o dacă nu e bine — rețin alegerea ta.";
        } else if(!g && catHint){ catHint.hidden = true; }
      }, 220);
    });
  }

  var sel = document.getElementById("fProv");
  if(sel){
    var box = document.getElementById("fCloseBox"), val = document.getElementById("fCloseVal");
    var chint = document.getElementById("fCloseHint"), picked = false;
    var amtEl = document.getElementById("fAmt");

    function setChoice(v){
      val.value = v ? "1" : "0";
      Array.prototype.forEach.call(box.querySelectorAll("[data-cls]"), function(b){
        b.setAttribute("aria-pressed", (b.getAttribute("data-cls") === "1") === !!v);
      });
      var pr = S.provisions.filter(function(x){ return x.id === sel.value; })[0];
      if(!pr) return;
      var rest = Math.max(0, provRemaining(pr, ui.month) - parseNum(amtEl.value));
      chint.textContent = v
        ? (rest > 0 ? "Provizionul dispare din sold, inclusiv diferența de " + lei(rest) + "."
                    : "Provizionul se închide — nu mai rămâne nimic de plătit din el.")
        : (rest > 0 ? "Rămân " + lei(rest) + " provizionați pentru restul cheltuielilor."
                    : "Provizionul rămâne deschis, dar suma lui e deja acoperită.");
    }
    function refreshBox(){
      var pr = S.provisions.filter(function(x){ return x.id === sel.value; })[0];
      box.hidden = !pr;
      if(!pr) return;
      if(!picked) setChoice(parseNum(amtEl.value) >= provRemaining(pr, ui.month));
      else setChoice(val.value === "1");
    }
    Array.prototype.forEach.call(box.querySelectorAll("[data-cls]"), function(b){
      b.addEventListener("click", function(){ picked = true; setChoice(b.getAttribute("data-cls") === "1"); });
    });
    amtEl.addEventListener("input", refreshBox);

    sel.addEventListener("change", function(){
      picked = false;
      var pr = S.provisions.filter(function(x){ return x.id === sel.value; })[0];
      if(pr){
        amtEl.value = String(provRemaining(pr, ui.month)).replace(".",",");
        if(pr.catId) document.getElementById("fCat").value = pr.catId;
        document.getElementById("fNote").value = pr.name;
      }
      refreshBox();
    });
    if(presetProvId){ sel.dispatchEvent(new Event("change")); } else refreshBox();
  }
}

/* --- income sheet --- */
function sheetIncome(kind, id){
  var f = (kind==="fix" && id) ? S.fixed.filter(function(x){ return x.id===id; })[0] : null;
  var v = (kind==="var" && id) ? S.incomes.filter(function(x){ return x.id===id; })[0] : null;
  var cur = f || v;
  var k = cur ? (f?"fix":"var") : (kind==="var"?"var":"fix");
  var h = '<h3>'+(cur?"Editează venitul":"Venit nou")+'</h3>';
  if(!cur){
    h += '<div class="seg"><button data-kind="fix" aria-pressed="'+(k==="fix")+'">Venit lunar stabil</button><button data-kind="var" aria-pressed="'+(k==="var")+'">Venit variabil</button></div>';
    h += '<p class="hint" id="kindHint" style="margin:-6px 2px 14px"></p>';
  }
  h += '<label class="f"><span>Denumire</span><input class="inp" id="iName" data-focus placeholder="ex. Salariu" value="'+esc(cur?cur.name:"")+'"></label>';
  h += moneyField("Sumă" + (f ? " în " + mLabel(ui.month).split(" ")[0] : ""), "iAmt",
                  f ? fixedAmount(f, ui.month) : (v ? v.amount : null));
  if(k === "fix"){
    h += '<p class="hint" style="margin:-6px 2px 14px">Suma se aplică din '+esc(mLabel(ui.month))+
         ' înainte. Lunile dinainte rămân cu suma pe care o aveau.</p>';
  }
  if(f){

  h += '<p class="hint" style="margin:-6px 2px 14px">O cheltuială pe care o știi dinainte — rată, abonament, chirie. Se scade din sold acum, iar când o înregistrezi ca plătită, provizionul dispare.</p>';

       '<option value="term"'+(mode==="term"?" selected":"")+'>Nr. de rate</option>'+
       '<option value="once"'+(mode==="once"?" selected":"")+'>O singură dată</option>'+
       '</select></label></div>';
  h += '<div id="pTermBox"'+(mode==="term"?"":" hidden")+'>'+
       '<div class="grid2">'+
       '<label class="f"><span>Rata în '+esc(mLabel(ui.month).split(" ")[0])+'</span><input class="inp num" id="pIdx" type="number" min="1" inputmode="numeric" value="'+curIdx+'"></label>'+
       '<label class="f"><span>Din total rate</span><input class="inp num" id="pTot" type="number" min="1" inputmode="numeric" placeholder="ex. 24" value="'+((p&&p.term)?p.term:"")+'"></label>'+
       '</div><p class="hint" id="pTermHint" style="margin:-6px 2px 14px"></p></div>';
  if(p && isOff(p, ui.month)){
    h += '<p class="hint" style="margin:0 2px 10px;color:var(--warn)">'+esc(offReason(p, ui.month))+'.</p>'+
         '<button class="btn ghost" style="margin-bottom:14px" data-reactivate="prov|'+p.id+'">Reactivează…</button>';
  }
  if(p && (paid > 0 || settled)){
    var pays = provPayments(p, ui.month);
    h += '<div style="background:var(--surface2);border-radius:13px;padding:12px 14px;margin-bottom:14px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)">'+
      '<span>Plăți în '+esc(mLabel(ui.month).split(" ")[0])+'</span><span>'+(settled?"închis":"deschis")+'</span></div>';
    h += pays.map(function(x){
      return '<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:13.5px">'+
        '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.note || cat(x.catId).name)+'</span>'+
        '<span class="num" style="font-weight:600;flex:none">'+esc(lei(x.amount))+'</span></div>';
    }).join("") || '<p class="hint" style="margin:6px 0 0">Fără plăți înregistrate.</p>';
    h += '<div style="display:flex;justify-content:space-between;gap:10px;padding-top:9px;margin-top:4px;border-top:1px solid var(--line);font-weight:700;font-size:13.5px">'+
      '<span>'+(settled ? "Rămas neutilizat" : "Rest de acoperit")+'</span>'+
      '<span class="num" style="color:'+(settled?"var(--muted)":"var(--warn)")+'">'+esc(lei(settled ? Math.max(0, p.amount - paid) : remaining))+'</span></div>';
    h += '</div>';
  }
  h += '<button class="btn" data-save="prov" data-id="'+(p?p.id:"")+'">'+(p?"Salvează":"Adaugă provizionul")+'</button>';
  if(p){
    if(!settled){
      h += '<button class="btn ghost" style="margin-top:8px" data-payprov="'+p.id+'">Înregistrează o plată</button>';
      if(remaining > 0 && paid > 0) h += '<button class="btn ghost" style="margin-top:8px" data-closeprov="'+p.id+'">Închide-l acum (renunț la restul de '+esc(leiShort(remaining))+')</button>';
    } else {
      h += '<button class="btn ghost" style="margin-top:8px" data-reopenprov="'+p.id+'">Redeschide provizionul</button>';
    }
    h += p.recurring
      ? '<button class="btn dang" style="margin-top:8px" data-delscopeopen="prov|'+p.id+'">Șterge sau oprește provizionul…</button>'
      : '<button class="btn dang" style="margin-top:8px" data-del="prov" data-id="'+p.id+'">Șterge provizionul</button>';
  }
  openSheet(h);

  var rec = document.getElementById("pRec"), box = document.getElementById("pTermBox");
  var idxI = document.getElementById("pIdx"), totI = document.getElementById("pTot"), hint = document.getElementById("pTermHint");
  function refreshTerm(){
    box.hidden = rec.value !== "term";
    if(box.hidden) return;
    var i = parseInt(idxI.value,10) || 1, t = parseInt(totI.value,10) || 0;
    var amt = parseNum(document.getElementById("pAmt").value);
    if(t < 1){ hint.textContent = "Completează câte rate are în total (ex. 24)."; return; }
    if(i > t){ hint.textContent = "Rata curentă (" + i + ") depășește totalul de " + t + "."; return; }
    var left = t - i + 1;
    var lastM = shiftM(ui.month, left - 1);
    hint.textContent = "Mai ai " + left + (left===1?" rată":(left<20?" rate":" de rate")) +
      ", ultima în " + mLabel(lastM) + (amt>0 ? " · rest de plată " + lei(left*amt) : "") + ".";
  }
  rec.addEventListener("change", refreshTerm);
  idxI.addEventListener("input", refreshTerm);
  totI.addEventListener("input", refreshTerm);
  document.getElementById("pAmt").addEventListener("input", refreshTerm);
  refreshTerm();
}

/* --- arhiva: ce nu se aplica in luna deschisa --- */
function archivedItems(m){
  var out = [];
  S.fixed.forEach(function(f){
    if(fixedLive(f, m)) return;
    var why = offReason(f, m);
    if(!why){
      if(f.active === false) return;
      why = "începe din " + mLabel(fixedStart(f));
    }
    out.push({ kind:"fix", obj:f, why:why, kindLabel:"venit fix" });
  });
  S.provisions.forEach(function(p){
    if(provActive(p, m)) return;
    var why = offReason(p, m);
    if(!why){
      if(!p.recurring) why = "o singură dată, în " + mLabel(p.month);
      else if(p.term){
        var lm = provLastMonth(p);
        why = (m > lm) ? ("încheiat · ultima rată în " + mLabel(lm)) : ("începe din " + mLabel(p.from));
      } else why = "începe din " + mLabel(p.from || m);
    }
    out.push({ kind:"prov", obj:p, why:why, kindLabel: p.recurring ? (p.term ? "rată" : "provizion lunar") : "provizion o singură dată" });
  });
  return out;
}
function monthOptions(sel){
  var base = mk(new Date()), out = "";
  for(var i = -18; i <= 18; i++){
    var mm = shiftM(base, i);
    out += '<option value="'+mm+'"'+(mm===sel?" selected":"")+'>'+esc(mLabel(mm))+'</option>';
  }
  return out;
}
function sheetArchive(){
  var m = ui.month, items = archivedItems(m);
  var h = '<h3>Arhivă</h3>';
  h += '<p class="hint" style="margin:-6px 2px 16px">Ce nu se aplică în '+esc(mLabel(m))+
       ': venituri și provizioane oprite, sărite peste o lună sau încheiate. Nu apar în ecranele de lucru, dar le poți reactiva oricând.</p>';
  if(!items.length){
    h += '<div class="empty">Nimic în arhivă pentru '+esc(mLabel(m))+'.</div>';
    openSheet(h); return;
  }
  h += items.map(function(it){
    var col = it.kind === "fix" ? "#2E8B51" : (it.obj.catId ? cat(it.obj.catId).color : "#B5721A");
    return '<div class="row" style="cursor:default;align-items:flex-start;padding:12px 14px">'+
      '<span class="chip" style="background:'+tint(col,.14)+';color:'+col+'">'+esc(it.kind==="fix"?"F":initials(it.obj.name))+'</span>'+
      '<span class="main"><span class="t">'+esc(it.obj.name)+'</span>'+
      '<span class="s">'+esc(it.kindLabel)+' · '+esc(it.why)+'</span>'+
      '<span style="display:flex;gap:8px;margin-top:9px">'+
        '<button type="button" class="btn ghost" style="width:auto;padding:8px 12px;font-size:13px" data-reactivate="'+it.kind+'|'+it.obj.id+'">Reactivează</button>'+
        '<button type="button" class="btn ghost" style="width:auto;padding:8px 12px;font-size:13px" data-openitem="'+it.kind+'|'+it.obj.id+'">Deschide</button>'+
      '</span></span></div>';
  }).join("");
  openSheet(h);
}
function sheetReactivate(kind, id){
  var obj = (kind === "fix" ? S.fixed : S.provisions).filter(function(x){ return x.id === id; })[0];
  if(!obj) return;
  var restart = kind === "prov" && obj.recurring && obj.term && ui.month > provLastMonth(obj);
  var h = '<h3>Reactivează „'+esc(obj.name)+'"</h3>';
  h += '<p class="hint" style="margin:-6px 2px 14px">'+
       (restart ? 'Seria de rate s-a încheiat, deci repornește de la rata 1 din luna aleasă.'
                : 'Se aplică din luna aleasă înainte. Lunile dinainte rămân neatinse.')+'</p>';
  h += '<label class="f"><span>Din luna</span><select class="inp" id="reMonth">'+monthOptions(ui.month)+'</select></label>';
  h += '<button class="btn" data-doreactivate="'+kind+'|'+id+'">Reactivează</button>';
  openSheet(h);
}
function doReactivate(kind, id){
  var obj = (kind === "fix" ? S.fixed : S.provisions).filter(function(x){ return x.id === id; })[0];
  if(!obj) return;
  var R = document.getElementById("reMonth").value;
  if(kind === "prov" && obj.recurring && obj.term && R > provLastMonth(obj)){
    obj.from = R; obj.startIdx = 1;
  }
  if(kind === "prov" && !obj.recurring) obj.month = R;
  if(kind === "fix"){
    var h = fixHist(obj);
    if(fixedAmount(obj, R) === null) h[R] = obj.amount || 0;
    obj.active = true;
  }
  reactivateFrom(obj, R);
  ui.month = R;
  closeSheet(); commit("Reactivat din " + mLabel(R));
}

function sheetDeleteScope(kind, id){
  var obj = (kind === "fix" ? S.fixed : S.provisions).filter(function(x){ return x.id === id; })[0];
  if(!obj) return;
  var m = ui.month, luna = mLabel(m), start = kind === "fix" ? fixedStart(obj) : (obj.from || m);
  var isFirst = m <= start;
  var h = '<h3>' + esc(obj.name) + '</h3>';

       '<b>Doar din '+esc(luna)+'</b><br><span style="font-weight:500;font-size:12.5px;opacity:.7">Sare peste luna asta, revine luna viitoare</span></button>';
  if(!isFirst){
    h += '<button class="btn ghost" style="margin-bottom:8px;text-align:left" data-delscope="'+kind+'|'+id+'|future">'+
         '<b>Din '+esc(luna)+' înainte</b><br><span style="font-weight:500;font-size:12.5px;opacity:.7">Se oprește aici; lunile dinainte rămân neatinse</span></button>';
  }
  h += '<button class="btn dang" style="text-align:left" data-delscope="'+kind+'|'+id+'|all">'+
       '<b>Din toate lunile</b><br><span style="font-weight:500;font-size:12.5px;opacity:.75">Șterge complet, inclusiv din trecut</span></button>';
  openSheet(h);
}
function applyDeleteScope(kind, id, scope){
  var list = kind === "fix" ? S.fixed : S.provisions;
  var obj = list.filter(function(x){ return x.id === id; })[0];
  if(!obj) return;
  var m = ui.month, msg;
  if(scope === "all"){
    if(kind === "fix") S.fixed = S.fixed.filter(function(x){ return x.id !== id; });
    else S.provisions = S.provisions.filter(function(x){ return x.id !== id; });
    msg = "Șters din toate lunile";
  } else if(scope === "month"){
    addOff(obj, m, m);
    msg = "Scos doar din " + mLabel(m) + " — îl găsești în Arhivă";
  } else {
    var start = kind === "fix" ? fixedStart(obj) : (obj.from || m);
    if(m <= start){
      if(kind === "fix") S.fixed = S.fixed.filter(function(x){ return x.id !== id; });
      else S.provisions = S.provisions.filter(function(x){ return x.id !== id; });
      msg = "Șters complet";
    } else {
      addOff(obj, m, null);
      msg = "Oprit din " + mLabel(m) + " — îl găsești în Arhivă";
    }
  }
  closeSheet(); commit(msg);
}

/* ============ actions ============ */
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("on"); }, 1900);
}
function commit(msg){ save(); render(); if(msg) toast(msg); }

function saveExpense(id){
  var amt = parseNum(document.getElementById("fAmt").value);
  if(amt <= 0){ toast("Adaugă o sumă mai mare ca zero"); return; }
  var catId = document.getElementById("fCat").value;
  var date = document.getElementById("fDate").value || dateInMonth(ui.month);
  var note = document.getElementById("fNote").value.trim();
  var provSel = document.getElementById("fProv");
  var provId = provSel ? provSel.value : "";
  learnFrom(note, catId);
  if(id){
    var e = S.expenses.filter(function(x){ return x.id===id; })[0];
    e.amount = amt; e.catId = catId; e.date = date; e.note = note;
  } else {
    var ne = {id:uid(), amount:amt, catId:catId, date:date, note:note, ts:Date.now()};
    S.expenses.push(ne);
    if(provId){
      var p = S.provisions.filter(function(x){ return x.id===provId; })[0];
      if(p){
        var mm = date.slice(0,7);
        p.pay = p.pay || {};
        var rec = p.pay[mm] || { ids:[], closed:false };
        rec.ids = (rec.ids || []).concat([ne.id]);
        var cv = document.getElementById("fCloseVal");
        rec.closed = !cv || cv.value === "1";
        p.pay[mm] = rec;
      }
    }
  }
  closeSheet(); commit(id ? "Cheltuială actualizată" : "Cheltuială înregistrată");
}
function deleteExpense(id){
  S.expenses = S.expenses.filter(function(x){ return x.id!==id; });
  S.provisions.forEach(function(p){
    if(!p.pay) return;
    for(var m in p.pay){
      var rec = p.pay[m];
      var i = (rec.ids || []).indexOf(id);
      if(i !== -1){
        rec.ids.splice(i,1);
        if(!rec.ids.length) rec.closed = false;
      }
    }
  });
  closeSheet(); commit("Cheltuială ștearsă");
}
function saveIncome(id){
  var name = document.getElementById("iName").value.trim() || "Venit";
  var amt = parseNum(document.getElementById("iAmt").value);
  var kind = document.getElementById("iKind").value;
  if(amt <= 0){ toast("Adaugă o sumă mai mare ca zero"); return; }
  var dayEl = document.getElementById("iDay");
  var day = dayEl ? (parseInt(dayEl.value,10) || null) : null;
  if(day && (day < 1 || day > 31)) day = null;
  if(id){
    var cur = (kind==="fix" ? S.fixed : S.incomes).filter(function(x){ return x.id===id; })[0];
    if(cur){
      cur.name = name;
      if(kind==="fix"){
        var h = fixHist(cur);
        var was = fixedAmount(cur, ui.month);
        if(was !== amt) h[ui.month] = amt;   /* modificarea porneste din luna deschisa */
        cur.amount = amt; cur.day = day;
      } else cur.amount = amt;
    }
  } else if(kind==="fix"){
    var nf = {id:uid(), name:name, amount:amt, from:ui.month, active:true, day:day, hist:{}};
    nf.hist[ui.month] = amt;
    S.fixed.push(nf);
  } else {
    S.incomes.push({id:uid(), name:name, amount:amt, month:ui.month});
  }
  closeSheet(); commit("Venit salvat");
}
function saveProvision(id){
  var name = document.getElementById("pName").value.trim() || "Provizion";
  var amt = parseNum(document.getElementById("pAmt").value);
  if(amt <= 0){ toast("Adaugă o sumă mai mare ca zero"); return; }
  var catId = document.getElementById("pCat").value;
  var day = parseInt(document.getElementById("pDay").value,10);
  var mode = document.getElementById("pRec").value;
  var rec = mode !== "once";
  var term = null, startIdx = 1;
  if(mode === "term"){
    term = parseInt(document.getElementById("pTot").value,10) || 0;
    startIdx = parseInt(document.getElementById("pIdx").value,10) || 1;
    if(term < 1){ toast("Câte rate are în total?"); return; }
    if(startIdx < 1) startIdx = 1;
    if(startIdx > term){ toast("Rata curentă nu poate depăși totalul"); return; }
  }
  if(id){
    var p = S.provisions.filter(function(x){ return x.id===id; })[0];
    p.name=name; p.amount=amt; p.catId=catId; p.day=day||null; p.recurring=rec;
    if(rec){
      p.term = term;
      if(term){ p.from = ui.month; p.startIdx = startIdx; }
      else if(!p.from) p.from = ui.month;
    } else { p.month = p.month || ui.month; p.term = null; }
  } else {
    S.provisions.push({id:uid(), name:name, amount:amt, catId:catId, day:day||null,
      recurring:rec, term:term, startIdx:startIdx, from:ui.month, month:ui.month, settled:{}});
  }
  closeSheet(); commit("Provizion salvat");
}
function saveBudgets(){
  var m = ui.month;
  if(!S.budgets[m]) S.budgets[m] = {};
  Array.prototype.forEach.call(sheet.querySelectorAll("[data-bud]"), function(inp){
    var id = inp.getAttribute("data-bud");
    var raw = inp.value.trim();
    var std = sheet.querySelector('[data-std="'+id+'"]').getAttribute("aria-pressed")==="true";
    if(raw===""){ delete S.budgets[m][id]; if(!std) delete S.stdBudgets[id]; return; }
    var v = parseNum(raw);
    S.budgets[m][id] = v;
    if(std) S.stdBudgets[id] = v; else delete S.stdBudgets[id];
  });
  closeSheet(); commit("Bugete salvate");
}
function saveCat(id){
  var name = document.getElementById("cName").value.trim();
  if(!name){ toast("Dă un nume categoriei"); return; }
  var col = document.getElementById("cCol").value;
  var std = parseNum(document.getElementById("cStd").value);
  if(id){
    var c = S.cats.filter(function(x){ return x.id===id; })[0];
    c.name = name; c.color = col;
    if(std>0) S.stdBudgets[id] = std; else delete S.stdBudgets[id];
  } else {
    var nc = {id:uid(), name:name, color:col};
    S.cats.push(nc);
    if(std>0) S.stdBudgets[nc.id] = std;
  }
  closeSheet(); commit("Categorie salvată");
}
function deleteCat(id){
  var used = S.expenses.filter(function(e){ return e.catId===id; }).length
           + S.provisions.filter(function(p){ return p.catId===id; }).length;
  if(used && !confirm("Categoria are "+used+" înregistrări. Le ștergi odată cu ea?")) return;
  S.expenses = S.expenses.filter(function(e){ return e.catId!==id; });
  S.provisions = S.provisions.filter(function(p){ return p.catId!==id; });
  S.cats = S.cats.filter(function(c){ return c.id!==id; });
  unlearnCategory(id);
  delete S.stdBudgets[id];
  for(var m in S.budgets){ delete S.budgets[m][id]; }
  if(!S.cats.length) S.cats.push({id:uid(), name:"Altele", color:PALETTE[0]});
  closeSheet(); commit("Categorie ștearsă");
}

/* ============ events ============ */
document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-reactivate],[data-doreactivate],[data-openitem],[data-delscopeopen],[data-delscope],[data-delhist],[data-install],[data-nav],[data-sheet],[data-editexp],[data-editprov],[data-editfix],[data-editinc],[data-editcat],[data-save],[data-del],[data-toggle],[data-copybud],[data-payprov],[data-closeprov],[data-reopenprov],[data-copytxt],[data-restore],[data-forget],[data-reset]") : null;
  if(!t) return;
  var a = function(k){ return t.getAttribute(k); };

  if(a("data-nav")){ ui.view = a("data-nav"); render(); return; }
  if(a("data-sheet")){
    var s = a("data-sheet");
    if(s==="exp") sheetExpense(null);
    else if(s==="exp-from-prov"){ var op = openProvisions(ui.month); sheetExpense(null, op.length?op[0].p.id:null); }
    else if(s==="inc") sheetIncome("fix");
    else if(s==="prov") sheetProvision(null);
    else if(s==="budget") sheetBudget();
    else if(s==="cat") sheetCat(null);
    else if(s==="archive") sheetArchive();
    else if(s==="backup") sheetBackup();
    else if(s==="restore") sheetRestore();
    return;
  }
  if(a("data-editexp")){ sheetExpense(a("data-editexp")); return; }
  if(a("data-editprov")){ sheetProvision(a("data-editprov")); return; }
  if(a("data-editfix")){ sheetIncome("fix", a("data-editfix")); return; }
  if(a("data-editinc")){ sheetIncome("var", a("data-editinc")); return; }
  if(a("data-editcat")){ sheetCat(a("data-editcat")); return; }

  if(a("data-save")){
    var k = a("data-save");
    if(k==="exp") saveExpense(a("data-id"));
    else if(k==="inc") saveIncome(a("data-id"));
    else if(k==="prov") saveProvision(a("data-id"));
    else if(k==="budget") saveBudgets();
    else if(k==="cat") saveCat(a("data-id"));
    return;
  }
  if(a("data-del")){
    var d = a("data-del"), id = a("data-id");
    if(d==="exp") deleteExpense(id);
    else if(d==="prov"){ S.provisions = S.provisions.filter(function(x){ return x.id!==id; }); closeSheet(); commit("Provizion șters"); }
    else if(d==="cat") deleteCat(id);
    else if(d==="inc"){
      if(a("data-kind")==="fix") S.fixed = S.fixed.filter(function(x){ return x.id!==id; });
      else S.incomes = S.incomes.filter(function(x){ return x.id!==id; });
      closeSheet(); commit("Venit șters");
    }
    return;
  }
  if(a("data-payprov")){ var pid = a("data-payprov"); closeSheet(); setTimeout(function(){ sheetExpense(null, pid); }, 120); return; }
  if(a("data-closeprov")){
    var cp = S.provisions.filter(function(x){ return x.id===a("data-closeprov"); })[0];
    if(cp){ cp.pay = cp.pay || {}; var r1 = cp.pay[ui.month] || {ids:[],closed:false}; r1.closed = true; cp.pay[ui.month] = r1; }
    closeSheet(); commit("Provizion închis"); return;
  }
  if(a("data-reopenprov")){
    var op = S.provisions.filter(function(x){ return x.id===a("data-reopenprov"); })[0];
    if(op && op.pay && op.pay[ui.month]) op.pay[ui.month].closed = false;
    closeSheet(); commit("Provizion redeschis"); return;
  }
  if(a("data-install")){
    if(deferredInstall){
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function(){ deferredInstall = null; render(); });
    }
    return;
  }
  if(a("data-reactivate")){
    var ra = a("data-reactivate").split("|");
    closeSheet(); setTimeout(function(){ sheetReactivate(ra[0], ra[1]); }, 140);
    return;
  }
  if(a("data-doreactivate")){
    var rb = a("data-doreactivate").split("|");
    doReactivate(rb[0], rb[1]);
    return;
  }
  if(a("data-openitem")){
    var oi = a("data-openitem").split("|");
    closeSheet();
    setTimeout(function(){ oi[0] === "fix" ? sheetIncome("fix", oi[1]) : sheetProvision(oi[1]); }, 140);
    return;
  }
  if(a("data-delscopeopen")){
    var q = a("data-delscopeopen").split("|");
    closeSheet(); setTimeout(function(){ sheetDeleteScope(q[0], q[1]); }, 140);
    return;
  }
  if(a("data-delscope")){
    var w = a("data-delscope").split("|");
    applyDeleteScope(w[0], w[1], w[2]);
    return;
  }
  if(a("data-delhist")){
    var parts = a("data-delhist").split("|");
    var fh = S.fixed.filter(function(x){ return x.id===parts[0]; })[0];
    if(fh && fh.hist && Object.keys(fh.hist).length > 1){
      delete fh.hist[parts[1]];
      fh.amount = fixedAmount(fh, ui.month);
      closeSheet(); commit("Modificare ștearsă din istoric");
    }
    return;
  }
  if(a("data-toggle")==="carry"){ S.carry = !S.carry; commit(S.carry?"Report activat":"Report dezactivat"); return; }
  if(a("data-copybud")){
    var prev = shiftM(ui.month,-1), src = S.budgets[prev];
    if(!src || !Object.keys(src).length){ toast("Luna trecută nu are bugete setate"); return; }
    S.budgets[ui.month] = JSON.parse(JSON.stringify(src));
    commit("Bugete copiate din "+mLabel(prev)); return;
  }
  if(a("data-dlbackup")){
    try{
      var blob = new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url; link.download = "sold-lunar-backup-" + todayISO() + ".json";
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast("Backup descărcat");
    }catch(e){ toast("Copiază textul manual"); }
    return;
  }
  if(a("data-copytxt")){
    var ta = document.getElementById(a("data-copytxt"));
    ta.select(); ta.setSelectionRange(0, 999999);
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value); }
      else { document.execCommand("copy"); }
      toast("Copiat");
    }catch(e){ toast("Selectează textul și copiază manual"); }
    return;
  }
  if(a("data-restore")){
    try{
      var obj = JSON.parse(document.getElementById("rsTxt").value);
      if(!obj || !obj.cats) throw new Error("bad");
      S = obj;
      ["fixed","incomes","expenses","provisions"].forEach(function(kk){ if(!Array.isArray(S[kk])) S[kk]=[]; });
      if(!S.budgets) S.budgets={}; if(!S.stdBudgets) S.stdBudgets={};
      closeSheet(); commit("Date restaurate");
    }catch(e){ toast("Textul nu pare o copie validă"); }
    return;
  }
  if(a("data-forget")){
    S.learn = {};
    commit("Am uitat categoriile învățate"); return;
  }
  if(a("data-reset")){
    if(confirm("Ștergi definitiv toate veniturile, cheltuielile, provizioanele și bugetele din acest browser?")){
      S = seed(); closeSheet(); commit("Datele au fost șterse");
    }
    return;
  }
});

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault(); deferredInstall = e;
  if(ui.view === "settings") render();
});
window.addEventListener("appinstalled", function(){ deferredInstall = null; if(ui.view === "settings") render(); });

document.getElementById("prevM").addEventListener("click", function(){ ui.month = shiftM(ui.month,-1); render(); });
document.getElementById("nextM").addEventListener("click", function(){ ui.month = shiftM(ui.month,1); render(); });
document.getElementById("fab").addEventListener("click", function(){ sheetExpense(null); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });

/* theme */
function applyTheme(){
  if(S.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
}
document.getElementById("themeBtn").addEventListener("click", function(){
  S.theme = S.theme==="auto" ? "dark" : S.theme==="dark" ? "light" : "auto";
  applyTheme(); save();
  toast(S.theme==="auto" ? "Temă: automat" : S.theme==="dark" ? "Temă: întunecat" : "Temă: luminos");
});
applyTheme();

/* daca aplicatia ramane deschisa peste miezul noptii, reimprospatez la revenire */
var lastSeenDay = todayISO();
function refreshIfNewDay(){
  var t = todayISO();
  if(t !== lastSeenDay){ lastSeenDay = t; render(); }
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) refreshIfNewDay(); });
window.addEventListener("focus", refreshIfNewDay);
setInterval(refreshIfNewDay, 60000);

render();

/* expose for self-test */
window.__app = {
  get S(){ return S; }, set S(v){ S=v; },
  ui:ui, balance:balance, totalIncome:totalIncome, totalExpense:totalExpense,
  totalOpenProv:totalOpenProv, byCategory:byCategory, budgetOf:budgetOf,
  provisionsFor:provisionsFor, provLastMonth:provLastMonth, provIdx:provIdx, provActive:provActive,
  provRemaining:provRemaining, provPaid:provPaid, provState:provState,
  carryPending:carryPending, curMonth:curMonth, carryInto:carryInto, fixedLive:fixedLive, archivedItems:archivedItems, reactivateFrom:reactivateFrom, isOff:isOff, addOff:addOff, applyDeleteScope:applyDeleteScope, fixedAmount:fixedAmount, fixedStart:fixedStart, fixedChanges:fixedChanges, fixedFor:fixedFor,
  nextSalary:nextSalary, provisionsDueBy:provisionsDueBy, dateForDay:dateForDay,
  guessCategory:guessCategory, learnFrom:learnFrom, normTxt:normTxt,
  uid:uid, seed:seed, render:render, save:save
};
})();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
